<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시장 신호</title>
<style>
/* CLAUDE.md 디자인 규칙. 오래된 회계장부·신문 금융면의 톤.
   폰트는 저장소 안(assets/fonts)에서 불러온다 — 바깥으로 요청이 나가면
   오프라인에서 글자가 바뀌고 자체 완결 보장도 깨진다. */
@font-face{font-family:'Noto Serif KR';src:url('assets/fonts/noto-serif-kr-korean-400.woff2')
  format('woff2');font-weight:400;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7A3}
@font-face{font-family:'Noto Serif KR';src:url('assets/fonts/noto-serif-kr-latin-400.woff2')
  format('woff2');font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Pretendard';src:url('assets/fonts/pretendard-400.woff2')
  format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/pretendard-600.woff2')
  format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('assets/fonts/ibm-plex-mono-400.woff2')
  format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('assets/fonts/ibm-plex-mono-500.woff2')
  format('woff2');font-weight:500;font-display:swap}

:root{
  --paper:#F5F2EC; --surface:#FFFDF8; --ink:#1C1A17; --ink-muted:#6B6558;
  --rule:#DED8CC; --accent:#2C4A45; --up:#C4443D; --down:#3D6099;
}
/* 규칙에 다크는 네 가지만 정해져 있다. 나머지 넷은 어두운 종이 위에서 읽히도록
   같은 계열에서 밝기만 올린 임시값이다. */
@media (prefers-color-scheme:dark){:root{
  --paper:#14130F; --surface:#1C1A16; --ink:#E8E3D8; --rule:#2E2B24;
  --ink-muted:#9A9384; --accent:#7FA89F; --up:#D9645C; --down:#6E8FC4;
}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);
  font:15px/1.6 'Pretendard',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
/* IBM Plex Mono 에는 한글이 없다. Pretendard 를 뒤에 둬야 '최근 250일' 같은
   문자열에서 한글만 시스템 모노로 떨어지지 않는다. */
.num{font-family:'IBM Plex Mono','Pretendard',ui-monospace,monospace;
  font-variant-numeric:tabular-nums}
h1,h2{font-family:'Noto Serif KR',serif;font-weight:400}

/* 스크롤 없이 한 화면. 100dvh 라야 주소창이 접혔다 펴져도 안 잘린다. */
#app{height:100dvh;display:flex;flex-direction:column;
  padding:calc(20px + env(safe-area-inset-top)) 20px
          calc(14px + env(safe-area-inset-bottom))}

.head{display:flex;align-items:baseline;gap:12px;
  padding-bottom:14px;border-bottom:1px solid var(--rule)}
h1{font-size:22px;letter-spacing:-.2px}
.back{margin-left:auto;font-size:13px;text-decoration:none;color:var(--accent);
  border-bottom:1px solid var(--rule);padding-bottom:1px}

/* 지수 한 덩이 = 괘선으로 구분된 한 단락. 박스를 쓰지 않는다. */
.idx{flex:1 1 0;min-height:0;display:flex;flex-direction:column;
  justify-content:center;padding:24px 0;border-bottom:1px solid var(--rule)}
.idx h2{font-size:17px;color:var(--ink-muted)}
/* 화면에서 큰 숫자는 셋뿐이다 — 지수별 백분위 둘, 상대강도 하나. */
.big{font-size:44px;line-height:1.15;margin-top:2px;letter-spacing:-1px}
.big .unit{font-size:20px;color:var(--ink-muted);margin-left:4px}
.sub{font-size:12.5px;color:var(--ink-muted);margin-top:4px}
.rows{margin-top:14px;display:grid;grid-template-columns:auto 1fr;
  gap:5px 16px;font-size:13px}
.rows dt{color:var(--ink-muted)}
.rows dd{text-align:right}
.u{color:var(--up)} .d{color:var(--down)}

.rs{display:flex;align-items:baseline;gap:12px;padding:18px 0 0}
.rs .lab{font-size:13px;color:var(--ink-muted)}
.rs .big{font-size:26px}
foot,footer{font-size:11.5px;color:var(--ink-muted);padding-top:12px;
  border-top:1px solid var(--rule);margin-top:auto}
#err{padding:32px 0;font-size:13.5px;color:var(--ink-muted);line-height:1.9}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <h1>시장 신호</h1>
    <!-- 대시보드에서 넘어온 사람이 돌아갈 길이 없으면 뒤로가기밖에 없다 -->
    <a class="back" href="index.html">종목으로</a>
  </div>
  <div id="body" style="display:contents"></div>
  <footer id="foot"></footer>
</div>

<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s)
  .replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var num = function(v, d){ return v === null || v === undefined ? '–'
  : v.toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d}); };
var signed = function(v, d){ return v === null || v === undefined ? '–'
  : (v > 0 ? '+' : '') + v.toFixed(d); };
// 주가는 오르면 빨강 내리면 파랑 — 국내 관례
var cls = function(v){ return v === null || v === undefined ? ''
  : v > 0 ? 'u' : v < 0 ? 'd' : ''; };

// 백분위는 '몇 %'보다 '하위/상위 몇 %'가 바로 읽힌다
function stretch(v){
  if (v === null || v === undefined) return {n:'–', u:''};
  return v <= 50 ? {n:'하위 ' + v.toFixed(0), u:'%'}
                 : {n:'상위 ' + (100 - v).toFixed(0), u:'%'};
}

function block(name, d){
  var s = stretch(d.stretch_pct);
  return '' +
  '<section class="idx">' +
    '<h2>' + name + '</h2>' +
    '<div class="big num ' + cls(d.stretch_pct === null ? null : d.stretch_pct - 50) + '">' +
      s.n + '<span class="unit">' + s.u + '</span></div>' +
    '<div class="sub">최근 ' + (d.stretch_days || 250) + '일 이격도 분포에서의 자리</div>' +
    '<dl class="rows">' +
      '<dt>종가</dt><dd class="num">' + num(d.close, 2) + '</dd>' +
      '<dt>20일선 이격도</dt><dd class="num ' + cls(d.disparity) + '">' +
        signed(d.disparity, 2) + '%</dd>' +
      '<dt>20일선 방향</dt><dd>' + esc(d.trend) +
        ' <span class="num">' + signed(d.slope_pct, 2) + '%</span></dd>' +
      '<dt>' + d.band_days + '일 범위</dt><dd class="num">' +
        num(d.band_low, 0) + ' ~ ' + num(d.band_high, 0) + '</dd>' +
    '</dl>' +
  '</section>';
}

function render(p){
  var r = p.computed || p;
  var html = block('코스피', r.indices['코스피']) + block('코스닥', r.indices['코스닥']);
  if (r.ratio){
    html += '<div class="rs"><span class="lab">코스닥 ÷ 코스피</span>' +
      '<span class="big num ' + cls(r.ratio.disparity) + '">' + esc(r.ratio.leader) +
      '</span><span class="lab num" style="margin-left:auto">이격도 ' +
      signed(r.ratio.disparity, 2) + '%</span></div>';
  }
  $('body').innerHTML = html;
  var d = r.as_of;
  $('foot').innerHTML = '<span class="num">' + d.slice(0,4) + '-' + d.slice(4,6) + '-' +
    d.slice(6,8) + '</span> 종가 기준 · 이동평균 ' +
    '<span class="num">' + (r.params ? r.params.sma : 20) + '</span>일' +
    (r.source ? ' · ' + esc(r.source) : '');
}

// 저장소의 원본은 store/market_signal.json 이지만 Pages 는 docs/ 만 서빙하므로
// 같은 내용의 사본을 docs/ 에 두고 그것을 읽는다.
fetch('market_signal.json', {cache: 'no-store'})
  .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(render)
  .catch(function(e){
    $('body').innerHTML = '<div id="err">시장 신호 데이터를 불러오지 못했습니다.<br>' +
      esc(e.message) + '<br><br>수집 워크플로가 아직 한 번도 돌지 않았을 수 있습니다.</div>';
  });
</script>
</body>
</html>
