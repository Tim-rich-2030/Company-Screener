<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SK하이닉스 코스터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ---------------------------------------------------------------------------
   릴스용 애니메이션 (1080x1920). 화면녹화 전용이라 조작 UI는 하나도 두지 않는다.
   다시 보려면 새로고침하거나 화면을 탭한다.
   --------------------------------------------------------------------------- */
:root{
  --rail:#E23B3B;          /* 실제 구간 레일 */
  --rail-dim:#E23B3B;      /* 예측 구간도 같은 색, 투명도로만 구분 */
  --ink:#fff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
              system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased;
  cursor:none;                       /* 녹화에 마우스 커서가 찍히지 않게 */
}

#stage{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  transform-origin:0 0;background:#050507;overflow:hidden;
}
#stage.shake{animation:shake .28s linear infinite}
@keyframes shake{
  0%{transform:translate(0,0)}   25%{transform:translate(-9px,6px)}
  50%{transform:translate(7px,-8px)} 75%{transform:translate(-5px,-4px)}
  100%{transform:translate(0,0)}
}
/* shake 는 #stage 의 scale 을 덮어쓰므로 별도 래퍼에 scale 을 건다 */
#fit{position:absolute;left:0;top:0;transform-origin:0 0}

/* --- 배경 --- */
#sky{
  position:absolute;inset:0;
  background:
    radial-gradient(120% 70% at 50% 8%, #1b1030 0%, #0a0a14 55%, #050507 100%);
}
#stars{position:absolute;inset:0;opacity:.55}
#ground{
  position:absolute;left:0;right:0;top:1560px;bottom:0;
  background:linear-gradient(#141420 0%, #08080e 100%);
  border-top:3px solid rgba(255,255,255,.14);
}

/* --- 월드(카메라가 좌우로 미는 레이어) --- */
#world{position:absolute;left:0;top:0;height:1920px;will-change:transform}
#track{position:absolute;left:0;top:0}

/* --- 카트 --- */
#cart{
  position:absolute;left:0;top:0;width:340px;height:118px;
  offset-rotate:0deg;                /* 회전 없이 항상 수평 */
  offset-anchor:50% 100%;            /* 밑면 중앙이 레일에 닿게 */
  z-index:6;
}
#cartInner{position:absolute;left:0;top:0;width:100%;height:100%;
  transform:translateY(-6px);will-change:transform}
.cartBody{
  position:absolute;left:0;top:0;width:100%;height:100%;
  border-radius:18px 18px 26px 26px;
  background:linear-gradient(#ff6a3d,#c2261b);
  box-shadow:0 10px 0 rgba(0,0,0,.35), inset 0 4px 0 rgba(255,255,255,.28);
  border:5px solid #2b0b09;
}
.rider{
  position:absolute;bottom:26px;height:214px;width:auto;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));
  z-index:1;transition:opacity .18s;
}
#antA{left:-22px}
#antB{right:-22px;transform:scaleX(-1)}
.cartFront{
  position:absolute;left:0;bottom:0;width:100%;height:74px;
  border-radius:0 0 22px 22px;
  background:linear-gradient(#e2492a,#a71d14);
  border-top:4px solid rgba(0,0,0,.3);
  z-index:2;
}
.cartFront::after{
  content:"";position:absolute;left:50%;top:22px;transform:translateX(-50%);
  width:120px;height:8px;border-radius:4px;background:rgba(255,255,255,.25);
}
.wheel{
  position:absolute;bottom:-19px;width:38px;height:38px;border-radius:50%;
  background:#17171d;border:5px solid #4a4a55;z-index:3;
}
.wheel.l{left:44px} .wheel.r{right:44px}

/* --- 지상 개미 --- */
.walker{
  position:absolute;height:250px;width:auto;z-index:5;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.5));
  transform:translate(-50%,-100%);
}

/* --- 배경 코스터의 카트 --- */
.bgcart{
  position:absolute;z-index:1;opacity:0;
  transform:translate(-50%,-100%);
  filter:brightness(0.4) blur(1px);
}
.bgcart img{height:96px;width:auto;display:block}   /* 40% 크기 */

/* --- 말풍선 --- */
#bubble{
  position:absolute;z-index:9;transform:translate(-50%,-100%);
  opacity:0;pointer-events:none;
}
#bubble.on{animation:pop .26s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-88%) scale(.7)}
               to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
.balloon{
  position:relative;padding:26px 42px;background:#fff;color:#14141b;
  font-size:60px;font-weight:800;letter-spacing:-1px;white-space:nowrap;
  border:7px solid #14141b;
  border-radius:44px 52px 40px 56px/52px 40px 56px 44px;  /* 손그림 느낌 */
  box-shadow:10px 12px 0 rgba(0,0,0,.35);
  transform:rotate(-1.6deg);
}
.balloon::after{                                   /* 꼬리 */
  content:"";position:absolute;left:50%;bottom:-38px;margin-left:-22px;
  width:0;height:0;border:22px solid transparent;
  border-top-color:#14141b;border-bottom:0;
}
.balloon::before{
  content:"";position:absolute;left:50%;bottom:-27px;margin-left:-15px;z-index:1;
  width:0;height:0;border:15px solid transparent;
  border-top-color:#fff;border-bottom:0;
}
/* 5번 비트와 11번 비트가 똑같이 보여야 한다 — 같은 클래스를 쓴다 */
.balloon.hype{
  background:#FFE24A;color:#2a1600;border-color:#2a1600;transform:rotate(1.8deg);
}
.balloon.hype::after{border-top-color:#2a1600}
.balloon.hype::before{border-top-color:#FFE24A}

/* --- HUD (월드와 무관하게 고정) --- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20}
.grid{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.10)}
.gridlab{
  position:absolute;left:24px;transform:translateY(-50%);
  font-size:30px;font-weight:700;color:rgba(255,255,255,.42);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px #050507, 0 0 6px #050507;   /* 트랙과 겹쳐도 읽히게 */
}
#axisUnit{position:absolute;left:24px;top:352px;font-size:26px;color:rgba(255,255,255,.35);font-weight:600}
#title{
  position:absolute;right:34px;top:60px;text-align:right;
}
#title b{display:block;font-size:56px;font-weight:900;letter-spacing:-2px}
#title span{display:block;margin-top:8px;font-size:28px;font-weight:600;color:rgba(255,255,255,.5)}
#disclaimer{
  position:absolute;left:0;right:0;bottom:70px;text-align:center;
  font-size:30px;font-weight:600;color:rgba(255,255,255,.6);letter-spacing:-.5px;
}
#handle{
  position:absolute;right:34px;bottom:26px;
  font-size:26px;font-weight:700;color:rgba(255,255,255,.38);
}

/* --- 오프닝 카운트다운 --- */
#count{
  position:absolute;inset:0;display:grid;place-items:center;z-index:30;
  font-size:420px;font-weight:900;letter-spacing:-20px;color:#fff;
  text-shadow:0 0 60px rgba(226,59,59,.8);
  opacity:0;
}
#count.go{animation:tick .4s ease-out both}
@keyframes tick{
  0%{opacity:0;transform:scale(.86)}
  18%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.35)}
}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="sky"></div>
  <svg id="stars" width="1080" height="1920"></svg>
  <div id="ground"></div>

  <div id="world">
    <svg id="track" height="1920"></svg>
    <div id="bgcarts"></div>
    <img class="walker" id="walkA" alt="">
    <img class="walker" id="walkB" alt="">
    <div id="cart"><div id="cartInner">
      <div class="cartBody">
        <img class="rider" id="antA" alt="">
        <img class="rider" id="antB" alt="">
        <div class="cartFront"></div>
        <div class="wheel l"></div><div class="wheel r"></div>
      </div>
    </div></div>
    <div id="bubble"><div class="balloon" id="balloon"></div></div>
  </div>

  <div id="hud">
    <div id="axisUnit">단위: 만원</div>
    <div id="title"><b>SK하이닉스 코스터</b><span>2026-07-31 종가 171.8만원 기준</span></div>
    <div id="disclaimer">예측선은 개인 의견이며 투자 권유가 아닙니다</div>
    <div id="handle">@ggujungbuja</div>
  </div>

  <div id="count"></div>
</div></div>

<script>
"use strict";
/* ===========================================================================
   1. 좌표계
   ---------------------------------------------------------------------------
   주가(만원)를 y 로, 시간축을 x 로 놓은 월드를 만들고 카메라(=#world 의
   translateX)가 카트를 따라간다. 화면 폭 1080 에 22개 지점을 다 넣으면 지점
   간격이 40px 밖에 안 되어 카트도 개미도 안 보인다. 그래서 월드를 길게 깔고
   가로로 흘린다.
   =========================================================================== */
const W = 1080, H = 1920;

// 2026-07-31 종가(171.8만) 이후의 예측 경로. 단위 만원.
const REAL_CLOSE = 171.8;
const PRED = [180,190,200,205,210,200,190,180,160,170,180,190,200,160,140,160,170,180,190,210,230];
const ANCH = [REAL_CLOSE, ...PRED];          // 22개 지점

const P_MIN = 130, P_MAX = 240;              // y 매핑 범위 (눈금은 140~230)
const Y_TOP = 430, Y_BOT = 1300;
const GROUND_Y = 1560;
const X0 = 700, STEP = 265;                  // 예측 시작 x, 지점 간격
const PLATFORM_X = 120;                      // 출발 승강장 왼쪽 끝
const SEG = 24;                              // 지점 사이 샘플 수
const CAM_X = 400;                           // 화면에서 카트가 놓일 x

const py = p => Y_TOP + (P_MAX - p) / (P_MAX - P_MIN) * (Y_BOT - Y_TOP);
const px = i => X0 + i * STEP;

const WORLD_W = px(ANCH.length - 1) + 900;

/* Catmull-Rom 보간 — 지점을 그대로 지나면서 부드럽게 이어준다. */
function catmullRom(pts, seg){
  const out = [], P = [pts[0], ...pts, pts[pts.length - 1]];
  for(let i = 1; i < P.length - 2; i++){
    const [x0,y0]=P[i-1], [x1,y1]=P[i], [x2,y2]=P[i+1], [x3,y3]=P[i+2];
    for(let j = 0; j < seg; j++){
      const t=j/seg, t2=t*t, t3=t2*t;
      out.push([
        .5*(2*x1 + (-x0+x2)*t + (2*x0-5*x1+4*x2-x3)*t2 + (-x0+3*x1-3*x2+x3)*t3),
        .5*(2*y1 + (-y0+y2)*t + (2*y0-5*y1+4*y2-y3)*t2 + (-y0+3*y1-3*y2+y3)*t3)
      ]);
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}

const anchorPts = ANCH.map((p, i) => [px(i), py(p)]);
const curvePts  = catmullRom(anchorPts, SEG);

// 승강장(실제 구간): 7/31 종가 높이의 평평한 직선. 여기까지가 확정된 사실이고
// 오른쪽부터는 전부 예측이다.
const platPts = [];
for(let j = 0; j < SEG; j++){
  platPts.push([PLATFORM_X + (X0 - PLATFORM_X) * (j / SEG), py(REAL_CLOSE)]);
}
const PTS = platPts.concat(curvePts);
const REAL_END = platPts.length;                 // 이 인덱스가 곧 경계
const anchorIdx = k => REAL_END + k * SEG;

// 누적 거리 — 카트 위치를 거리로 다루면 구간마다 속도를 조절하기 쉽다.
const CUM = [0];
for(let i = 1; i < PTS.length; i++){
  CUM.push(CUM[i-1] + Math.hypot(PTS[i][0]-PTS[i-1][0], PTS[i][1]-PTS[i-1][1]));
}
const TOTAL = CUM[CUM.length - 1];
const anchorDist = k => CUM[anchorIdx(k)];

function pointAt(d){
  d = Math.max(0, Math.min(TOTAL, d));
  let lo = 0, hi = CUM.length - 1;
  while(lo < hi - 1){ const mid = (lo + hi) >> 1; (CUM[mid] <= d ? lo = mid : hi = mid); }
  const span = CUM[hi] - CUM[lo] || 1, t = (d - CUM[lo]) / span;
  return [PTS[lo][0] + (PTS[hi][0]-PTS[lo][0])*t, PTS[lo][1] + (PTS[hi][1]-PTS[lo][1])*t];
}

const dOf = pts => "M" + pts.map(p => p[0].toFixed(1) + "," + p[1].toFixed(1)).join("L");
const D_ALL  = dOf(PTS);
const D_REAL = dOf(PTS.slice(0, REAL_END + 1));
const D_PRED = dOf(PTS.slice(REAL_END));

/* ===========================================================================
   2. 트랙 그리기 — 레일 2줄 + 침목 + 지지 기둥
   =========================================================================== */
const SVGNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("track");
svg.setAttribute("width", WORLD_W);
svg.setAttribute("viewBox", `0 0 ${WORLD_W} ${H}`);

function el(tag, attrs, parent){
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(n);
  return n;
}
const g = name => el("g", {id: name});

// --- 배경(보조) 트랙: 메인보다 아래·뒤쪽으로 평행하게 한 줄 ---
const gBg = g("bg");
gBg.setAttribute("transform", "translate(60,250)");
gBg.setAttribute("opacity", ".28");
for(let i = 0; i < PTS.length; i += 12){
  el("line", {x1:PTS[i][0], y1:PTS[i][1], x2:PTS[i][0], y2:GROUND_Y,
              stroke:"#3a2430", "stroke-width":3}, gBg);
}
el("path", {d:D_ALL, fill:"none", stroke:"#4d2e3a", "stroke-width":7}, gBg);

// --- 지지 기둥. 촘촘하면 창살처럼 보여 개미가 안 보인다 — 90px 정도씩 띄운다 ---
const gCol = g("cols");
for(let i = 0; i < PTS.length; i += 8){
  const real = i <= REAL_END;
  el("line", {x1:PTS[i][0], y1:PTS[i][1], x2:PTS[i][0], y2:GROUND_Y,
              stroke:"#7d1f1f",
              "stroke-width": real ? 8 : 3,
              "stroke-opacity": real ? .8 : .28,
              "stroke-dasharray": real ? "none" : "14 12"}, gCol);
}

// --- 레일: 같은 경로를 4px 어긋나게 두 번 (2줄) + 짧은 대시(침목) ---
function rails(d, opacity, dash){
  const grp = el("g", {"stroke-opacity":opacity});
  el("path", {d, fill:"none", stroke:"var(--rail)", "stroke-width":26,
              "stroke-linecap":"butt", "stroke-dasharray":"6 22",
              "stroke-opacity":opacity * .9}, grp);          // 침목
  for(const dy of [-2, 2]){
    const p = el("path", {d, fill:"none", stroke:"var(--rail)", "stroke-width":7,
                          "stroke-linecap":"round"}, grp);
    p.setAttribute("transform", `translate(0,${dy})`);
    if(dash) p.setAttribute("stroke-dasharray", dash);
  }
  return grp;
}
rails(D_REAL, 1, null);            // 확정 구간: 불투명, 실선
rails(D_PRED, .5, "26 18");        // 예측 구간: 반투명, 점선

// --- 예측 경계 표시 ---
const bx = X0;
el("line", {x1:bx, y1:300, x2:bx, y2:GROUND_Y, stroke:"#fff", "stroke-width":3,
            "stroke-opacity":.45, "stroke-dasharray":"12 14"});
const lab = el("text", {x:bx + 18, y:352, fill:"#fff", "fill-opacity":.85,
                        "font-size":38, "font-weight":800});
lab.textContent = "여기부터는 예측";
const lab2 = el("text", {x:bx - 18, y:352, fill:"#fff", "fill-opacity":.45,
                         "font-size":32, "font-weight":700, "text-anchor":"end"});
lab2.textContent = "출발 승강장";

// --- 지점별 가격 라벨 ---
ANCH.forEach((p, i) => {
  const t = el("text", {x:px(i), y:py(p) - 44, fill:"#fff", "fill-opacity":.5,
                        "font-size":30, "font-weight":700, "text-anchor":"middle"});
  t.textContent = i === 0 ? "171.8" : String(p);
});

/* ===========================================================================
   3. 별 (배경 장식)
   =========================================================================== */
(function(){
  const s = document.getElementById("stars");
  let seed = 20260731;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  for(let i = 0; i < 90; i++){
    const c = document.createElementNS(SVGNS, "circle");
    c.setAttribute("cx", (rnd() * W).toFixed(0));
    c.setAttribute("cy", (rnd() * 1200).toFixed(0));
    c.setAttribute("r", (rnd() * 2 + .6).toFixed(1));
    c.setAttribute("fill", "#fff");
    c.setAttribute("fill-opacity", (rnd() * .5 + .15).toFixed(2));
    s.appendChild(c);
  }
})();

/* ===========================================================================
   4. 눈금 (HUD — 월드와 같이 흐르지 않는다)
   =========================================================================== */
(function(){
  const hud = document.getElementById("hud");
  for(const p of [140,160,180,200,220,230]){
    const y = py(p);
    const line = document.createElement("div");
    line.className = "grid"; line.style.top = y + "px";
    const l = document.createElement("div");
    l.className = "gridlab"; l.style.top = y + "px"; l.textContent = p;
    hud.appendChild(line); hud.appendChild(l);
  }
})();

/* ===========================================================================
   5. 비트 시트 — 각 3초
   ---------------------------------------------------------------------------
   a  : 이 비트가 끝나는 지점(ANCH 인덱스)
   A/B: 그 비트에서 쓸 스프라이트
   ride: 카트 탑승 여부 (false 면 지상에 서 있다)
   =========================================================================== */
const easeInOut = u => -(Math.cos(Math.PI * u) - 1) / 2;
const easeOut   = u => 1 - Math.pow(1 - u, 3);
const clamp01   = u => Math.max(0, Math.min(1, u));

const BEATS = [
  // 1. 171.8만 — 배경 코스터가 지나간다
  {a:0,  A:"stand_01_gomin", B:"stand_01_gomin", rideA:false, rideB:false, bg:true},
  // 2. 180만
  {a:1,  A:"stand_01_gomin", B:"stand_01_gomin", rideA:false, rideB:false,
   say:"다시 사야 하나?"},
  // 3. 190만 — A 탑승
  {a:2,  A:"sit_02_hwanho",  B:"stand_01_gomin", rideA:true,  rideB:false, say:"타자!"},
  // 4. 200만 — B 탑승
  {a:3,  A:"sit_02_hwanho",  B:"sit_02_hwanho",  say:"나도!"},
  // 5. 205만
  {a:4,  A:"sit_02_hwanho",  B:"sit_02_hwanho",  say:"300만 가자!", cls:"hype"},
  // 6. 210만 — 정점에서 잠시 정지
  {a:5,  A:"sit_02_hwanho",  B:"sit_02_hwanho",  ease:u => easeOut(clamp01(u / .5))},
  // 7. 200 → 190
  {a:7,  A:"sit_03_bulan",   B:"sit_03_bulan",   say:"단기 조정 일거야!"},
  // 8. 180만
  {a:8,  A:"sit_03_bulan",   B:"sit_03_bulan",   say:"어…?"},
  // 9. 160만
  {a:9,  A:"sit_04_sasaek",  B:"sit_04_sasaek",  say:"본전만!!"},
  // 10. 170 → 180
  {a:11, A:"sit_05_ando",    B:"sit_05_ando",    say:"잘 버텼어"},
  // 11. 190만 — 5번과 똑같은 말풍선. 반복이 요점이다.
  {a:12, A:"sit_02_hwanho",  B:"sit_02_hwanho",  say:"300만 가자!", cls:"hype"},
  // 12. 200만
  {a:13, A:"sit_03_bulan",   B:"sit_03_bulan"},
  // 13. 140만 — 급락. 카트가 빨라지고 화면이 흔들린다.
  {a:15, A:"sit_04_sasaek",  B:"sit_04_sasaek",  say:"살려줘, 다신 안 해",
   ease:u => Math.pow(u, 2.4), shake:true},
  // 14. 160 → 170
  {a:17, A:"sit_04_sasaek",  B:"sit_04_sasaek",  say:"제발 본전만"},
  // 15. 180만 — 하차
  {a:18, A:"stand_02_ppudeut", B:"stand_02_ppudeut", rideA:false, rideB:false,
   say:"선방했다", ease:easeOut, alight:true},
  // 16. 190 → 230 — 빈 카트만 급등, 개미는 올려다본다
  {a:21, A:"stand_03_mangyeon", B:"stand_03_mangyeon", rideA:false, rideB:false,
   ease:u => Math.pow(clamp01(u / .72), 1.8), bg:true, finale:true},
];
BEATS.forEach(b => {
  if(b.rideA === undefined) b.rideA = true;
  if(b.rideB === undefined) b.rideB = true;
  if(!b.ease) b.ease = easeInOut;
});

const BEAT_MS = 3000, OPEN_MS = 1200;
const TOTAL_MS = OPEN_MS + BEATS.length * BEAT_MS;    // 49.2초

/* ===========================================================================
   6. 요소 준비
   =========================================================================== */
const ART = "../assets/ants/";
const sprite = (who, key) => `${ART}ant${who}_${key}.png`;
const $ = id => document.getElementById(id);

const cart = $("cart"), cartInner = $("cartInner");
const antA = $("antA"), antB = $("antB");
const walkA = $("walkA"), walkB = $("walkB");
const bubble = $("bubble"), balloon = $("balloon");
const world = $("world"), stage = $("stage"), fitBox = $("fit");

world.style.width = WORLD_W + "px";
cart.style.offsetPath = `path("${D_ALL}")`;
cart.style.offsetDistance = "0%";

// 배경 코스터의 카트 3대
const bgCarts = [];
for(let i = 0; i < 3; i++){
  const d = document.createElement("div");
  d.className = "bgcart";
  const im = document.createElement("img");
  im.src = sprite("A", "sit_02_hwanho"); im.alt = "";
  d.appendChild(im); $("bgcarts").appendChild(d);
  bgCarts.push({el:d, lead: 1600 + i * 620});
}

function setSprite(img, who, key){
  const src = sprite(who, key);
  if(img.dataset.key !== key){ img.src = src; img.dataset.key = key; }
}

function fit(){
  const s = Math.min(innerWidth / W, innerHeight / H);
  fitBox.style.transform = `scale(${s})`;
  fitBox.style.left = ((innerWidth  - W * s) / 2) + "px";
  fitBox.style.top  = ((innerHeight - H * s) / 2) + "px";
}
addEventListener("resize", fit); fit();

/* ===========================================================================
   7. 재생 루프
   =========================================================================== */
let t0 = 0, lastBeat = -1, lastCount = -1;
let camFreeze = null, groundHold = null;

function applyBeat(i){
  const b = BEATS[i];
  setSprite(antA, "A", b.A);  setSprite(antB, "B", b.B);
  setSprite(walkA, "A", b.A); setSprite(walkB, "B", b.B);
  antA.style.opacity  = b.rideA ? 1 : 0;
  antB.style.opacity  = b.rideB ? 1 : 0;
  walkA.style.display = b.rideA ? "none" : "block";
  walkB.style.display = b.rideB ? "none" : "block";

  balloon.className = "balloon" + (b.cls ? " " + b.cls : "");
  if(b.say){
    balloon.textContent = b.say;
    bubble.classList.remove("on"); void bubble.offsetWidth;
    bubble.classList.add("on");
    bubble.style.opacity = 1;
  }else{
    bubble.classList.remove("on");
    bubble.style.opacity = 0;
  }
  stage.classList.remove("shake");
}

function frame(now){
  if(!t0) t0 = now;
  const t = now - t0;

  // --- 오프닝: 3 · 2 · 1 (각 0.4초) ---
  if(t < OPEN_MS){
    const n = 3 - Math.floor(t / 400);
    if(n !== lastCount){
      lastCount = n;
      const c = $("count");
      c.textContent = String(n);
      c.classList.remove("go"); void c.offsetWidth; c.classList.add("go");
    }
    requestAnimationFrame(frame);
    return;
  }
  $("count").style.display = "none";

  const bt = t - OPEN_MS;
  const bi = Math.min(BEATS.length - 1, Math.floor(bt / BEAT_MS));
  const u  = clamp01((bt - bi * BEAT_MS) / BEAT_MS);
  const b  = BEATS[bi];

  if(bi !== lastBeat){ lastBeat = bi; applyBeat(bi); }

  // 급락 구간의 흔들림은 실제로 떨어지기 시작한 뒤에만 준다
  if(b.shake) stage.classList.toggle("shake", u > .35);

  // --- 카트 위치 ---
  const from = bi === 0 ? 0 : anchorDist(BEATS[bi - 1].a);
  const to   = anchorDist(b.a);
  const d    = from + (to - from) * clamp01(b.ease(u));
  cart.style.offsetDistance = (d / TOTAL * 100) + "%";
  const [cx, cy] = pointAt(d);

  // 마지막 비트: 목표 지점에 닿은 뒤 빈 카트만 화면 위로 사라진다
  if(b.finale){
    const over = clamp01((u - .72) / .28);
    cartInner.style.transform =
      `translateY(${-6 - over * over * 1500}px) scale(${1 - over * .25})`;
    cartInner.style.opacity = String(1 - over * .9);
  }

  // --- 지상 개미 ---
  // 15번에서 내린 뒤에는 카트 옆을 따라 걷다가, 16번에 들어서는 순간 그 자리에
  // 멈춘다. 카메라도 같은 순간 멈추므로 카트만 화면 밖으로 올라가고 개미는 남는다.
  if(b.finale){
    if(groundHold === null) groundHold = cx;
  }else{
    groundHold = null;
  }
  const gx = groundHold !== null ? groundHold : cx;
  walkA.style.left = (gx - 120) + "px"; walkA.style.top = GROUND_Y + "px";
  walkB.style.left = (gx + 120) + "px"; walkB.style.top = GROUND_Y + "px";

  // --- 말풍선: 타고 있으면 카트 위, 서 있으면 개미 위 ---
  const riding = b.rideA || b.rideB;
  bubble.style.left = (riding ? cx : gx) + "px";
  bubble.style.top  = (riding ? cy - 250 : GROUND_Y - 275) + "px";

  // --- 카메라: 카트를 따라가되 마지막 비트에서는 멈춰 개미를 남긴다 ---
  let cam = -(cx - CAM_X);
  if(b.finale){
    if(camFreeze === null) camFreeze = cam;
    cam = camFreeze;
  }else{
    camFreeze = null;
  }
  cam = Math.max(-(WORLD_W - W), Math.min(0, cam));
  world.style.transform = `translateX(${cam}px)`;

  // --- 배경 코스터: 1번·16번 비트에만 위로 지나간다 ---
  for(const bc of bgCarts){
    if(b.bg){
      const lead = bc.lead - u * (bc.lead + 900);
      const [bxp, byp] = pointAt(d + lead);
      bc.el.style.left = (bxp + 60) + "px";
      bc.el.style.top  = (byp + 250) + "px";
      bc.el.style.opacity = .95;
    }else{
      bc.el.style.opacity = 0;
    }
  }

  if(t < TOTAL_MS + 1200) requestAnimationFrame(frame);
  else stage.classList.remove("shake");
}

/* ===========================================================================
   8. 시작 — 폰트와 이미지가 다 준비된 뒤에 튼다.
   중간에 스프라이트가 늦게 뜨면 녹화본을 다시 찍어야 한다.
   =========================================================================== */
function preload(){
  const keys = ["sit_02_hwanho","sit_03_bulan","sit_04_sasaek","sit_05_ando",
                "stand_01_gomin","stand_02_ppudeut","stand_03_mangyeon"];
  const jobs = [];
  for(const who of ["A","B"]) for(const k of keys){
    jobs.push(new Promise(res => {
      const im = new Image();
      im.onload = im.onerror = res;
      im.src = sprite(who, k);
    }));
  }
  jobs.push(document.fonts ? document.fonts.ready : Promise.resolve());
  return Promise.race([
    Promise.all(jobs),
    new Promise(res => setTimeout(res, 6000))    // 못 받아도 6초 뒤엔 시작
  ]);
}

applyBeat(0);
preload().then(() => requestAnimationFrame(frame));

// 조작 UI 는 두지 않는다. 다시 보려면 아무데나 탭(또는 새로고침).
addEventListener("pointerdown", () => location.reload());
</script>
</body>
</html>
