<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SK하이닉스 상한가 그 이후…</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap">
<style>
/* ---------------------------------------------------------------------------
   릴스용 애니메이션 (1080x1920). 화면녹화 전용이라 조작 UI는 하나도 두지 않는다.
   다시 보려면 새로고침하거나 화면을 탭한다.
   --------------------------------------------------------------------------- */
:root{
  --rail:#E23B3B;
  --up:#E2453B;      /* 상승 — 국내 관례대로 빨강 */
  --down:#3B6FE2;    /* 하락 — 파랑 */
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,
              system-ui,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color:#fff;-webkit-font-smoothing:antialiased;
  cursor:none;                        /* 녹화에 커서가 찍히지 않게 */
}

#fit{position:absolute;left:0;top:0;transform-origin:0 0}
#stage{
  position:absolute;left:0;top:0;width:1080px;height:1920px;
  transform-origin:0 0;background:#080a12;overflow:hidden;
}
#stage.shake{animation:shake .28s linear infinite}
@keyframes shake{
  0%{transform:translate(0,0)}   25%{transform:translate(-9px,6px)}
  50%{transform:translate(7px,-8px)} 75%{transform:translate(-5px,-4px)}
  100%{transform:translate(0,0)}
}

/* --- 밤하늘 --- */
#sky{position:absolute;inset:0;
  background:linear-gradient(#0d1024 0%, #171a30 42%, #232338 74%, #2b2733 100%)}
#stars{position:absolute;inset:0}

/* --- 유원지 배경 3겹. 원경은 느리게, 근경은 빠르게 흐른다 --- */
.park{position:absolute;left:0;top:0;height:1920px;will-change:transform}
#parkFar{z-index:1} #parkMid{z-index:2} #parkNear{z-index:4}
#ground{
  position:absolute;left:0;right:0;top:1600px;bottom:0;z-index:3;
  background:linear-gradient(#2b2b38 0%, #16161f 55%, #0d0d14 100%);
  border-top:4px solid #3b3b4c;
}

/* --- 월드(카메라가 좌우로 미는 레이어) --- */
#world{position:absolute;left:0;top:0;height:1920px;z-index:5;will-change:transform}
#track{position:absolute;left:0;top:0}

/* --- 카트 --- */
#cart{
  position:absolute;left:0;top:0;width:300px;height:112px;
  offset-rotate:0deg;                 /* 회전 없이 항상 수평 */
  offset-anchor:50% 100%;             /* 밑면 중앙이 레일에 닿게 */
  z-index:6;
}
#cartInner{position:absolute;left:0;top:0;width:100%;height:100%;
  transform:translateY(-6px);will-change:transform}
.cartBody{
  position:absolute;left:0;top:0;width:100%;height:100%;
  border-radius:16px 16px 24px 24px;
  background:linear-gradient(#ff6a3d,#c2261b);
  box-shadow:0 10px 0 rgba(0,0,0,.38), inset 0 4px 0 rgba(255,255,255,.28);
  border:5px solid #2b0b09;
}
.rider{
  position:absolute;bottom:24px;height:200px;width:auto;
  filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));
  z-index:1;transition:opacity .18s;
}
#antA{left:-18px}
#antB{right:-18px;transform:scaleX(-1)}
.cartFront{
  position:absolute;left:0;bottom:0;width:100%;height:72px;
  border-radius:0 0 20px 20px;
  background:linear-gradient(#e2492a,#a71d14);
  border-top:4px solid rgba(0,0,0,.3);
  z-index:2;display:grid;place-items:center;
}
.cartFront span{
  font-size:25px;font-weight:900;letter-spacing:-1px;color:#ffe9de;
  text-shadow:0 2px 0 rgba(0,0,0,.45);
}
.wheel{
  position:absolute;bottom:-18px;width:36px;height:36px;border-radius:50%;
  background:#17171d;border:5px solid #4a4a55;z-index:3;
}
.wheel.l{left:40px} .wheel.r{right:40px}

/* --- 지상 개미 --- */
.walker{
  /* 카트(z-index 6)보다 앞. 뛰어내리는 동안 카트 뒤로 숨으면 안 된다 */
  position:absolute;height:212px;width:auto;z-index:7;
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.55));
  transform:translate(-50%,-100%);
}

/* --- 말풍선: 구름 모양. 윤곽선은 글자 폭을 재서 그때그때 그린다(drawCloud) --- */
#bubble{position:absolute;z-index:9;transform:translate(-50%,-100%);opacity:0}
#bubble.on{animation:pop .26s cubic-bezier(.2,1.7,.4,1) both}
@keyframes pop{from{opacity:0;transform:translate(-50%,-88%) scale(.7)}
               to{opacity:1;transform:translate(-50%,-100%) scale(1)}}
#balloonWrap{position:relative;display:inline-block;transform:rotate(-1.6deg)}
#cloud{position:absolute;z-index:1;overflow:visible;
  filter:drop-shadow(9px 11px 0 rgba(0,0,0,.42))}
#balloon{
  position:relative;z-index:2;padding:18px 46px;white-space:nowrap;
  font-family:"Nanum Pen Script","Pretendard Variable",Pretendard,cursive;
  font-size:80px;line-height:1.15;letter-spacing:2px;color:#14141b;
}
/* 5번과 11번이 똑같이 보여야 한다 — 같은 클래스를 쓴다 */
#balloonWrap.hype{transform:rotate(1.8deg)}
#balloonWrap.hype #balloon{color:#2a1600}
/* 12번에서 한 번 나온 대사가 13번에 더 크게, 떨면서 다시 나온다 */
#balloonWrap.panic{animation:tremble .085s linear infinite}
#balloonWrap.panic #balloon{font-size:112px;color:#a30f0f}
@keyframes tremble{
  0%{transform:rotate(-1.6deg) translate(0,0)}
  25%{transform:rotate(-2.8deg) translate(-5px,3px)}
  50%{transform:rotate(-.4deg) translate(4px,-4px)}
  75%{transform:rotate(-2.2deg) translate(-3px,-2px)}
  100%{transform:rotate(-1.6deg) translate(0,0)}
}

/* --- HUD --- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:20}
.grid{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.10)}
.gridlab{
  position:absolute;left:22px;transform:translateY(-50%);
  font-size:29px;font-weight:700;color:rgba(255,255,255,.5);
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px #0b0d18, 0 0 6px #0b0d18;
}
#axisUnit{position:absolute;left:22px;top:250px;font-size:25px;font-weight:600;
  color:rgba(255,255,255,.4);text-shadow:0 0 12px #0b0d18}
#title{
  position:absolute;left:0;right:0;top:54px;text-align:center;
  font-size:58px;line-height:1.16;font-weight:900;letter-spacing:-2.5px;
  text-shadow:0 6px 24px rgba(0,0,0,.85), 0 0 10px rgba(0,0,0,.6);
}
#foot{
  position:absolute;left:0;right:0;bottom:0;padding:0 60px 96px;text-align:center;
  background:linear-gradient(rgba(8,10,18,0) 0%, rgba(8,10,18,.82) 38%, rgba(8,10,18,.95) 100%);
  padding-top:120px;
}
#slogan{
  font-family:"Nanum Pen Script","Pretendard Variable",Pretendard,cursive;
  font-size:86px;line-height:1.05;color:#FFE24A;letter-spacing:1px;
  text-shadow:4px 5px 0 rgba(0,0,0,.6);transform:rotate(-1.2deg);
  white-space:nowrap;                 /* 두 줄로 접히면 손글씨 맛이 죽는다 */
}
#fineprint{
  margin-top:22px;font-size:25px;line-height:1.45;font-weight:600;
  color:rgba(255,255,255,.62);letter-spacing:-.4px;
}
#handle{
  position:absolute;right:34px;bottom:26px;z-index:21;
  font-size:26px;font-weight:700;color:rgba(255,255,255,.45);
}

/* --- 오프닝 카운트다운 --- */
#count{
  position:absolute;inset:0;display:grid;place-items:center;z-index:30;
  font-size:420px;font-weight:900;letter-spacing:-20px;color:#fff;
  text-shadow:0 0 60px rgba(226,59,59,.85);opacity:0;
}
#count.go{animation:tick .4s ease-out both}
@keyframes tick{
  0%{opacity:0;transform:scale(.86)}
  18%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.35)}
}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <div id="sky"></div>
  <svg id="stars" width="1080" height="1920"></svg>

  <div class="park" id="parkFar"></div>
  <div class="park" id="parkMid"></div>
  <div id="ground"></div>
  <div class="park" id="parkNear"></div>

  <div id="world">
    <svg id="track" height="1920"></svg>
    <img class="walker" id="walkA" alt="">
    <img class="walker" id="walkB" alt="">
    <div id="cart"><div id="cartInner">
      <div class="cartBody">
        <img class="rider" id="antA" alt="">
        <img class="rider" id="antB" alt="">
        <div class="cartFront"><span>SK하이닉스 코스터</span></div>
        <div class="wheel l"></div><div class="wheel r"></div>
      </div>
    </div></div>
    <div id="bubble"><div id="balloonWrap">
      <svg id="cloud"></svg><div id="balloon"></div>
    </div></div>
  </div>

  <div id="hud">
    <div id="axisUnit">단위: 만원</div>
    <!-- 한 줄로 두면 62px에서 화면을 넘고, 자동으로 줄이면 44px까지 작아져
         릴스 제목으로 약하다. 읽기 좋은 지점에서 직접 끊는다. -->
    <div id="title">SK하이닉스 상한가 이후<br>개인에게 벌어질 일들..</div>
    <div id="foot">
      <div id="slogan">주식은 감정이 아닌 원칙대로</div>
      <div id="fineprint">
        본 콘텐츠는 투자 권유가 아닌 참고용으로 작성되었으며<br>
        투자 판단의 책임은 본인에게 있습니다.
      </div>
    </div>
  </div>
  <div id="handle">@ggujungbuja</div>

  <div id="count"></div>
</div></div>

<script>
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const W = 1080, H = 1920;
const $ = id => document.getElementById(id);

/* ===========================================================================
   0. 난수 — 새로고침할 때마다 배경이 달라지면 녹화를 다시 찍어야 한다.
      씨앗을 고정해 항상 같은 그림이 나오게 한다.
   =========================================================================== */
function rng(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ===========================================================================
   1. 좌표계
   ---------------------------------------------------------------------------
   주가(만원)를 y 로, 시간축을 x 로 놓은 월드를 만들고 카메라(=레이어의
   translateX)가 카트를 따라간다. 화면 폭 1080 에 다 넣으면 지점 간격이 40px라
   카트도 개미도 안 보인다. 그래서 월드를 길게 깔고 가로로 흘린다.
   =========================================================================== */
const P_MIN = 115, P_MAX = 320;         // 프리퀄의 130만~300만까지 담아야 한다
const Y_TOP = 300, Y_BOT = 1380;
const GROUND_Y = 1600;
const CAM_X = 400;                      // 화면에서 카트가 놓일 x
const SEG = 22;                         // 지점 사이 샘플 수

const py = p => Y_TOP + (P_MAX - p) / (P_MAX - P_MIN) * (Y_BOT - Y_TOP);
const pv = y => P_MAX - (y - Y_TOP) / (Y_BOT - Y_TOP) * (P_MAX - P_MIN);

// [가격(만원), 직전 지점과의 가로 간격]
// 간격을 좁히면 그만큼 기울기가 서진다. 급락·급등 구간을 일부러 좁혔다.
const SPEC = [
  // ── 프리퀄: 실제 구간 (300만 고점 → 130만 → 상한가 171.8만) ──
  [300, 0], [300, 190], [292, 150], [272, 145], [244, 140], [212, 140],
  [180, 140], [152, 140], [132, 145], [130, 130],
  [171.8, 105],                          // 수직에 가까운 상한가
  // ── 출발 승강장 ──
  [171.8, 300],
  // ── 코스터 ──
  [180, 235], [190, 235], [200, 235], [205, 200], [210, 200],
  [200, 200], [190, 200], [180, 200], [160, 190], [170, 200],
  [180, 200], [190, 210], [200, 210],
  [160, 175], [140, 165],                // 급락
  [160, 190], [170, 200], [180, 210], [190, 210], [210, 200],
  [230, 195],                            // 마지막 급등
];
const I_LIMIT_UP = 10;                   // 상한가 지점 (프리퀄의 끝)
const I_A0       = 11;                   // 비트 a:0 = 승강장 오른쪽 끝
const I_PEAK = 0, I_BOTTOM = 9;

const ANCH = [];
{
  let x = 120;
  for(const [p, dx] of SPEC){ x += dx; ANCH.push([x, py(p), p]); }
}
const ax = i => ANCH[i][0], ay = i => ANCH[i][1];
const WORLD_W = ax(ANCH.length - 1) + 900;
const CAM_MIN = -(WORLD_W - W);

/* --- Centripetal Catmull-Rom --------------------------------------------
   균등(uniform) 방식은 간격이 크게 다른 지점이 붙어 있으면 고리를 만든다.
   상한가처럼 거의 수직인 구간이 있으니 centripetal(alpha=0.5)을 쓴다.        */
function catmullRom(pts, seg, alpha){
  const P = [pts[0], ...pts, pts[pts.length - 1]];
  const out = [];
  const knot = (t, a, b) => t + Math.pow(Math.hypot(b[0]-a[0], b[1]-a[1]), alpha) || t + 1e-4;
  for(let i = 1; i < P.length - 2; i++){
    const p0=P[i-1], p1=P[i], p2=P[i+1], p3=P[i+2];
    const t0=0, t1=knot(t0,p0,p1), t2=knot(t1,p1,p2), t3=knot(t2,p2,p3);
    for(let j = 0; j < seg; j++){
      const t = t1 + (t2 - t1) * (j / seg);
      const mix = (a, b, ta, tb) => {
        const d = (tb - ta) || 1e-6, u = (t - ta) / d;
        return [a[0] + (b[0]-a[0])*u, a[1] + (b[1]-a[1])*u];
      };
      const A1 = mix(p0,p1,t0,t1), A2 = mix(p1,p2,t1,t2), A3 = mix(p2,p3,t2,t3);
      const B1 = mix(A1,A2,t0,t2), B2 = mix(A2,A3,t1,t3);
      out.push(mix(B1,B2,t1,t2));
    }
  }
  out.push(pts[pts.length - 1]);
  return out;
}
const PTS = catmullRom(ANCH.map(a => [a[0], a[1]]), SEG, 0.5);
const anchorIdx = k => k * SEG;

// 누적 거리 — 카트 위치를 거리로 다루면 구간마다 속도를 조절하기 쉽다.
const CUM = [0];
for(let i = 1; i < PTS.length; i++){
  CUM.push(CUM[i-1] + Math.hypot(PTS[i][0]-PTS[i-1][0], PTS[i][1]-PTS[i-1][1]));
}
const TOTAL = CUM[CUM.length - 1];
const anchorDist = k => CUM[anchorIdx(k)];

function pointAt(d){
  d = Math.max(0, Math.min(TOTAL, d));
  let lo = 0, hi = CUM.length - 1;
  while(lo < hi - 1){ const m = (lo + hi) >> 1; (CUM[m] <= d ? lo = m : hi = m); }
  const span = CUM[hi] - CUM[lo] || 1, t = (d - CUM[lo]) / span;
  return [PTS[lo][0] + (PTS[hi][0]-PTS[lo][0])*t, PTS[lo][1] + (PTS[hi][1]-PTS[lo][1])*t];
}
// x 는 계속 증가하므로 x 로도 바로 찾을 수 있다 (봉차트 생성에 쓴다)
function yAtX(x){
  if(x <= PTS[0][0]) return PTS[0][1];
  if(x >= PTS[PTS.length-1][0]) return PTS[PTS.length-1][1];
  let lo = 0, hi = PTS.length - 1;
  while(lo < hi - 1){ const m = (lo + hi) >> 1; (PTS[m][0] <= x ? lo = m : hi = m); }
  const span = PTS[hi][0] - PTS[lo][0] || 1, t = (x - PTS[lo][0]) / span;
  return PTS[lo][1] + (PTS[hi][1]-PTS[lo][1])*t;
}

/* ===========================================================================
   2. 트랙 — 지지 철골 → 봉차트 → 레일 순서로 겹친다
   =========================================================================== */
const svg = $("track");
svg.setAttribute("width", WORLD_W);
svg.setAttribute("viewBox", `0 0 ${WORLD_W} ${H}`);
const el = (tag, attrs, parent) => {
  const n = document.createElementNS(SVGNS, tag);
  for(const k in attrs) n.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(n);
  return n;
};
const f1 = v => v.toFixed(1);

// --- X자 트러스: 선을 하나하나 만들면 요소가 수천 개가 된다. 한 path 로 묶는다 ---
(function truss(){
  const seg = [];
  for(let x = PTS[0][0]; x < PTS[PTS.length-1][0]; x += 148){
    const top = yAtX(x), h = GROUND_Y - top;
    if(h < 70) continue;
    const lx = y => x - 22 - 24 * (y - top) / h;      // 아래로 갈수록 벌어진다
    const rx = y => x + 22 + 24 * (y - top) / h;
    seg.push(`M${f1(lx(top))},${f1(top)}L${f1(lx(GROUND_Y))},${GROUND_Y}`);
    seg.push(`M${f1(rx(top))},${f1(top)}L${f1(rx(GROUND_Y))},${GROUND_Y}`);
    const cells = Math.max(1, Math.round(h / 125));
    for(let c = 0; c < cells; c++){
      const y0 = top + h * c / cells, y1 = top + h * (c + 1) / cells;
      seg.push(`M${f1(lx(y1))},${f1(y1)}L${f1(rx(y1))},${f1(y1)}`);
      seg.push(`M${f1(lx(y0))},${f1(y0)}L${f1(rx(y1))},${f1(y1)}`);
      seg.push(`M${f1(rx(y0))},${f1(y0)}L${f1(lx(y1))},${f1(y1)}`);
    }
  }
  el("path", {d: seg.join(""), fill:"none", stroke:"#6e4a4a",
              "stroke-width":3.4, "stroke-opacity":.55, "stroke-linecap":"round"});
})();

// --- 봉차트: 일봉 데이터가 없으므로 경로 좌표에서 OHLC 를 만든다.
//     한 봉의 구간 안에서 시작/끝 값이 시가·종가, 그 사이 최대·최소가 고가·저가다.
(function candles(){
  const STEP = 27, HALF = 9, OFF = 26;      // OFF: 레일보다 살짝 아래로 내린다
  const up = [], down = [];
  const x0 = PTS[0][0], x1 = PTS[PTS.length-1][0];
  for(let cx = x0 + STEP; cx < x1 - STEP; cx += STEP){
    const a = cx - STEP/2, b = cx + STEP/2;
    let hi = -1e9, lo = 1e9;
    for(let s = 0; s <= 6; s++){
      const v = pv(yAtX(a + (b - a) * s / 6));
      if(v > hi) hi = v; if(v < lo) lo = v;
    }
    const open = pv(yAtX(a)), close = pv(yAtX(b));
    const yo = py(open) + OFF, yc = py(close) + OFF;
    const top = Math.min(yo, yc), bot = Math.max(yo, yc);
    const bh = Math.max(4, bot - top);
    const box = `M${f1(cx-HALF)},${f1(top)}h${HALF*2}v${f1(bh)}h${-HALF*2}Z`;
    const wick = `M${f1(cx-1.6)},${f1(py(hi)+OFF)}h3.2v${f1(py(lo)-py(hi))}h-3.2Z`;
    (close >= open ? up : down).push(wick, box);
  }
  const g = el("g", {opacity:.6});
  el("path", {d: up.join(""),   fill:"var(--up)"},   g);
  el("path", {d: down.join(""), fill:"var(--down)"}, g);
})();

/* ===========================================================================
   3. 유원지 배경 — SVG 도형으로 그린 평면 일러스트.
      밤 유원지 분위기라 어둡고 채도가 낮다. 캐릭터와 레일이 앞에 있으므로
      배경은 대비를 낮게 유지한다.
   =========================================================================== */
function park(host, factor, seed, kind){
  const width = Math.ceil(Math.abs(CAM_MIN) * factor) + W + 500;
  const s = document.createElementNS(SVGNS, "svg");
  s.setAttribute("width", width); s.setAttribute("height", H);
  s.setAttribute("viewBox", `0 0 ${width} ${H}`);
  host.appendChild(s);
  host.style.width = width + "px";
  const add = (tag, attrs) => {
    const n = document.createElementNS(SVGNS, tag);
    for(const k in attrs) n.setAttribute(k, attrs[k]);
    s.appendChild(n); return n;
  };
  const R = rng(seed);
  const G = GROUND_Y;

  if(kind === "far"){
    // 능선
    let d = `M0,${G}`;
    for(let x = 0; x <= width; x += 160){
      d += `L${x},${(G - 150 - 70*Math.sin(x/620) - 40*Math.sin(x/210)).toFixed(1)}`;
    }
    add("path", {d: d + `L${width},${G}Z`, fill:"#1b2131"});

    for(let x = 40; x < width; x += 900 + R()*500){
      // 대관람차
      const cy = G - 300 - R()*90, r = 190 + R()*70;
      add("path", {d:`M${x-r*.55},${G}L${x},${cy}L${x+r*.55},${G}`,
                   stroke:"#2c3448", "stroke-width":11, fill:"none"});
      add("circle", {cx:x, cy, r, fill:"none", stroke:"#333d54", "stroke-width":8});
      add("circle", {cx:x, cy, r:r*.62, fill:"none", stroke:"#2c3448", "stroke-width":5});
      for(let k = 0; k < 14; k++){
        const a = k / 14 * Math.PI * 2;
        const ex = x + Math.cos(a)*r, ey = cy + Math.sin(a)*r;
        add("line", {x1:x, y1:cy, x2:ex.toFixed(1), y2:ey.toFixed(1),
                     stroke:"#2c3448", "stroke-width":4});
        add("rect", {x:(ex-14).toFixed(1), y:(ey-9).toFixed(1), width:28, height:22,
                     rx:7, fill: k % 4 === 0 ? "#6a5b46" : "#3d4863"});
      }
      add("circle", {cx:x, cy, r:20, fill:"#404a63"});
    }
    // 나무 (원경)
    for(let x = 0; x < width; x += 110 + R()*130){
      const h = 130 + R()*120, t = G - 120 - R()*60;
      add("rect", {x:x-7, y:t, width:14, height:h*.4, fill:"#1a202c"});
      add("path", {d:`M${x-h*.36},${t+18}L${x},${t-h*.62}L${x+h*.36},${t+18}Z`,
                   fill:"#1e2734"});
    }
  }

  if(kind === "mid"){
    for(let x = 260; x < width; x += 1100 + R()*700){
      // 회전목마
      const top = G - 330, rr = 175;
      add("rect", {x:x-rr, y:G-70, width:rr*2, height:70, rx:10, fill:"#2c2839"});
      add("ellipse", {cx:x, cy:G-70, rx:rr, ry:26, fill:"#3a3448"});
      for(let k = -2; k <= 2; k++){
        add("rect", {x:x + k*62 - 4, y:top+58, width:8, height:G-128-top-58+8,
                     fill:"#4a4256"});
      }
      // 원뿔 지붕 — 줄무늬
      for(let k = 0; k < 10; k++){
        const a0 = -Math.PI + k/10*Math.PI, a1 = -Math.PI + (k+1)/10*Math.PI;
        add("path", {d:`M${x},${top-72}L${(x+Math.cos(a0)*rr).toFixed(1)},${top+58}` +
                       `A${rr},${rr} 0 0 1 ${(x+Math.cos(a1)*rr).toFixed(1)},${top+58}Z`,
                     fill: k % 2 ? "#5b4a5c" : "#6d5566"});
      }
      add("path", {d:`M${x},${top-104}v34`, stroke:"#7d6a72", "stroke-width":7});
      add("path", {d:`M${x},${top-104}l52,15l-52,15Z`, fill:"#8a6a5e"});
      // 목마
      for(let k = -1; k <= 1; k++){
        const hx = x + k*105, hy = G - 150;
        add("rect", {x:hx-30, y:hy-26, width:60, height:34, rx:14, fill:"#5d5468"});
        add("rect", {x:hx+16, y:hy-46, width:24, height:28, rx:9, fill:"#5d5468"});
        add("rect", {x:hx-22, y:hy+6, width:9, height:30, fill:"#4b4356"});
        add("rect", {x:hx+14, y:hy+6, width:9, height:30, fill:"#4b4356"});
      }
    }
    // 텐트
    for(let x = 120; x < width; x += 470 + R()*420){
      const w2 = 105 + R()*45, h = 160 + R()*60;
      for(let k = 0; k < 6; k++){
        const xa = x - w2 + w2*2*k/6, xb = x - w2 + w2*2*(k+1)/6;
        add("path", {d:`M${xa.toFixed(1)},${G}L${x},${G-h}L${xb.toFixed(1)},${G}Z`,
                     fill: k % 2 ? "#3b3446" : "#494055"});
      }
      add("path", {d:`M${x},${G-h}v-34`, stroke:"#5a5166", "stroke-width":5});
      add("path", {d:`M${x},${G-h-34}l38,11l-38,11Z`, fill:"#7a5f52"});
    }
  }

  if(kind === "near"){
    // 부스
    for(let x = 90; x < width; x += 520 + R()*380){
      const w2 = 130 + R()*70, h = 150 + R()*40, top = G - h;
      add("rect", {x:x-w2, y:top, width:w2*2, height:h, rx:8, fill:"#221f2d"});
      add("rect", {x:x-w2, y:G-46, width:w2*2, height:46, fill:"#2e2a3a"});
      for(let k = 0; k < 8; k++){          // 줄무늬 차양
        const xa = x - w2 - 16 + (w2*2+32)*k/8, xb = x - w2 - 16 + (w2*2+32)*(k+1)/8;
        add("path", {d:`M${xa.toFixed(1)},${top-6}L${xb.toFixed(1)},${top-6}` +
                       `L${(xb-8).toFixed(1)},${top+42}L${(xa-8).toFixed(1)},${top+42}Z`,
                     fill: k % 2 ? "#5f4145" : "#8d8579"});
      }
      add("rect", {x:x-52, y:top-64, width:104, height:40, rx:8, fill:"#3b3346"});
      add("rect", {x:x-38, y:top-52, width:76, height:16, rx:6, fill:"#584c62"});
    }
    // 가로등 + 만국기
    let prev = null;
    for(let x = 200; x < width; x += 380 + R()*140){
      const h = 260 + R()*50, top = G - h;
      add("rect", {x:x-6, y:top, width:12, height:h, rx:5, fill:"#39364a"});
      add("circle", {cx:x, cy:top, r:44, fill:"#d9a441", opacity:.13});
      add("circle", {cx:x, cy:top, r:22, fill:"#d9a441", opacity:.28});
      add("path", {d:`M${x-17},${top+6}L${x+17},${top+6}L${x+9},${top-20}L${x-9},${top-20}Z`,
                   fill:"#c79a45"});
      if(prev){                            // 두 등 사이에 늘어진 깃발 줄
        const mid = (prev[0] + x) / 2, sag = Math.min(prev[1], top) + 78;
        add("path", {d:`M${prev[0]},${prev[1]+16}Q${mid},${sag} ${x},${top+16}`,
                     fill:"none", stroke:"#4c4459", "stroke-width":3});
        for(let k = 1; k < 8; k++){
          const u = k/8, ix = prev[0] + (x-prev[0])*u;
          const iy = (1-u)*(1-u)*(prev[1]+16) + 2*(1-u)*u*sag + u*u*(top+16);
          add("path", {d:`M${ix.toFixed(1)},${iy.toFixed(1)}l13,0l-6.5,20Z`,
                       fill: ["#5e4646","#42506a","#615a44","#4a5f4a"][k % 4]});
        }
      }
      prev = [x, top];
    }
    // 울타리
    for(let x = 0; x < width; x += 46){
      add("rect", {x, y:G+8, width:12, height:56, rx:5, fill:"#3a3648"});
    }
    add("rect", {x:0, y:G+26, width, height:9, fill:"#3a3648"});
  }
  return host;
}

/* --- 구름 말풍선 -----------------------------------------------------------
   글자 상자 둘레를 봉우리(원호)로 두르고, 아래쪽 봉우리 하나를 꼬리로 바꿔
   하나의 닫힌 path 로 만든다. 꼬리를 따로 그리면 몸통 윤곽선이 꼬리를 가로질러
   지나가 지저분해진다. 대사 길이가 제각각이라 모양을 고정할 수 없으므로
   글자 폭을 잰 뒤 그때그때 그린다.                                            */
const CLOUD_M = 30, TAIL_H = 68;
function drawCloud(w, h, cls){
  const x0 = CLOUD_M, y0 = CLOUD_M, x1 = CLOUD_M + w, y1 = CLOUD_M + h;
  const nx = Math.max(4, Math.round(w / 82));
  const ny = Math.max(2, Math.round(h / 64));
  const dx = w / nx, dy = h / ny;
  const rx = dx * .62, ry = dy * .62;      // 반지름을 반폭보다 키워야 봉긋하다
  const tailAt = Math.floor(nx / 2);
  const n1 = v => v.toFixed(1);

  let d = `M${n1(x0)},${n1(y0)}`;
  for(let i = 0; i < nx; i++) d += `A${n1(rx)},${n1(rx)} 0 0 1 ${n1(x0+dx*(i+1))},${n1(y0)}`;
  for(let j = 0; j < ny; j++) d += `A${n1(ry)},${n1(ry)} 0 0 1 ${n1(x1)},${n1(y0+dy*(j+1))}`;
  for(let i = 0; i < nx; i++){                       // 아래쪽은 오른쪽 → 왼쪽
    const px = x1 - dx * i, qx = x1 - dx * (i + 1);
    d += (i === tailAt)
      ? `L${n1((px+qx)/2 + 12)},${n1(y1 + TAIL_H)}L${n1(qx)},${n1(y1)}`
      : `A${n1(rx)},${n1(rx)} 0 0 1 ${n1(qx)},${n1(y1)}`;
  }
  for(let j = 0; j < ny; j++) d += `A${n1(ry)},${n1(ry)} 0 0 1 ${n1(x0)},${n1(y1-dy*(j+1))}`;

  const cw = w + CLOUD_M * 2, ch = h + CLOUD_M * 2 + TAIL_H;
  cloud.setAttribute("width", cw);
  cloud.setAttribute("height", ch);
  cloud.setAttribute("viewBox", `0 0 ${cw} ${ch}`);
  cloud.style.left = -CLOUD_M + "px";
  cloud.style.top  = -CLOUD_M + "px";
  cloudPath.setAttribute("d", d + "Z");
  cloudPath.setAttribute("fill",   cls === "hype" ? "#FFE24A" : "#fff");
  cloudPath.setAttribute("stroke", cls === "hype" ? "#2a1600" : "#14141b");
}

function say(text, cls){
  balloonWrap.className = cls || "";
  balloon.textContent = text;
  // 손글씨 폰트가 뜨지 않으면 대체 폰트가 훨씬 넓다. panic 대사는 112px라
  // 구름이 화면 밖으로 나가므로, 실제 폭을 재서 들어올 때까지 줄인다.
  balloon.style.fontSize = "";
  const room = W - 130 - CLOUD_M * 2;
  let size = parseFloat(getComputedStyle(balloon).fontSize);
  while(balloon.scrollWidth > room && size > 42){
    size -= 4;
    balloon.style.fontSize = size + "px";
  }
  drawCloud(balloon.offsetWidth, balloon.offsetHeight, cls);   // 읽는 순간 레이아웃 확정
  bubble.classList.remove("on"); void bubble.offsetWidth;
  bubble.classList.add("on");
  bubble.style.opacity = 1;
}
function hush(){ bubble.classList.remove("on"); bubble.style.opacity = 0; }

// 말풍선이 화면 밖으로 밀리지 않게 좌우로 붙잡는다 ("살려줘, 다신 안 해"처럼
// 긴 대사는 카트가 화면 왼쪽에 있을 때 잘린다).
function placeBubble(worldX, worldY, cam){
  const half = balloon.offsetWidth / 2 + CLOUD_M + 26;
  bubble.style.left = Math.min(Math.max(worldX, half - cam), W - half - cam) + "px";
  bubble.style.top  = worldY + "px";
}

let said = false;
function applyBeat(i){
  const b = BEATS[i];
  setSprite(antA, "A", b.A);  setSprite(antB, "B", b.B);
  setSprite(walkA, "A", b.A); setSprite(walkB, "B", b.B);
  antA.style.opacity  = b.rideA ? 1 : 0;
  antB.style.opacity  = b.rideB ? 1 : 0;
  walkA.style.display = b.rideA ? "none" : "block";
  walkB.style.display = b.rideB ? "none" : "block";

  said = false;
  if(b.say && !b.sayAt){ say(b.say, b.cls); said = true; }
  else hush();
  stage.classList.remove("shake");
}

function frame(now){
  if(!t0) t0 = now;
  const t = now - t0;

  // --- 오프닝: 3 · 2 · 1 (각 0.4초) ---
  if(t < OPEN_MS){
    const n = 3 - Math.floor(t / 400);
    if(n !== lastCount){
      lastCount = n;
      const c = $("count");
      c.textContent = String(n);
      c.classList.remove("go"); void c.offsetWidth; c.classList.add("go");
    }
    camera(0);
    requestAnimationFrame(frame);
    return;
  }
  $("count").style.display = "none";

  // --- 프리퀄: 실제 구간을 열차가 달린다 (300만 → 130만 → 상한가 171.8만) ---
  //     내려오는 도중 개미 둘이 카트에서 뛰어내려 바닥에 착지하고, 빈 카트는
  //     혼자 바닥을 찍고 상한가로 튀어올라 승강장에 선다.
  if(t < BEATS_AT){
    if(phase !== "preq"){ phase = "preq"; jumpFrom = null; preqSaid = false; }
    const u = (t - OPEN_MS) / PREQ_MS;

    const d = D_PEAK + (D_PARK - D_PEAK) * preqEase(u);
    cart.style.offsetDistance = (d / TOTAL * 100) + "%";
    const [cx, cy] = pointAt(d);
    const cam = camera(-(cx - CAM_X));

    const riding = u < JUMP_U;
    const key = u < .12 ? "sit_02_hwanho"
              : u < JUMP_U ? "sit_03_bulan"
              : u < LAND_U ? "sit_04_sasaek" : "stand_01_gomin";
    setSprite(antA, "A", key);  setSprite(antB, "B", key);
    setSprite(walkA, "A", key); setSprite(walkB, "B", key);
    antA.style.opacity = antB.style.opacity = riding ? 1 : 0;
    walkA.style.display = walkB.style.display = riding ? "none" : "block";

    // 뛰어내리기 직전에 신호를 준다 — 없으면 그냥 사라진 것처럼 보인다.
    // 착지할 때까지 남겨둬야 점프 동작과 대사가 이어진다.
    if(u > .28 && u < LAND_U){
      if(!preqSaid){ say("뛰어내려!"); preqSaid = true; }
      placeBubble(cx, cy - 300, cam);
    }else if(u >= LAND_U) hush();

    if(!riding){
      if(jumpFrom === null) jumpFrom = [cx, cy];
      // 착지 후에는 화면에 붙어 있게 둔다. 뒤로 풍경이 흐르니 걸어가는 것으로 읽힌다.
      const j = clamp01((u - JUMP_U) / (LAND_U - JUMP_U));
      const arc = Math.sin(Math.PI * j) * 120;          // 살짝 튀었다가 떨어진다
      const drop = (node, screenX) => {
        const tx = screenX - cam;
        node.style.left = (jumpFrom[0] + (tx - jumpFrom[0]) * j) + "px";
        node.style.top  = (jumpFrom[1] + (GROUND_Y - jumpFrom[1]) * j - arc) + "px";
      };
      drop(walkA, 300); drop(walkB, 520);
    }

    limitUp.setAttribute("opacity", clamp01((u - .82) / .14).toFixed(2));
    requestAnimationFrame(frame);
    return;
  }
  limitUp.setAttribute("opacity", 1);

  // --- 비트 ---
  const bt = t - BEATS_AT;
  const bi = Math.min(BEATS.length - 1, Math.floor(bt / BEAT_MS));
  const u  = clamp01((bt - bi * BEAT_MS) / BEAT_MS);
  const b  = BEATS[bi];
  if(bi !== lastBeat){ lastBeat = bi; applyBeat(bi); }

  // 대사를 비트 중간에 띄우는 경우 (정점을 지나 내려가기 시작한 뒤 등)
  if(b.sayAt && !said && u >= b.sayAt){ say(b.say, b.cls); said = true; }
  // 흔들림도 실제로 떨어지기 시작한 뒤에만 준다
  if(b.shake) stage.classList.toggle("shake", u > (b.shakeAt ?? .35));

  const from = bi === 0 ? D_PARK : anchorDist(BEATS[bi - 1].idx);
  const to   = anchorDist(b.idx);
  const d    = from + (to - from) * clamp01(b.ease(u));
  cart.style.offsetDistance = (d / TOTAL * 100) + "%";
  const [cx, cy] = pointAt(d);

  // 마지막 비트: 목표에 닿은 뒤 빈 카트만 화면 위로 사라진다
  if(b.finale){
    const over = clamp01((u - .72) / .28);
    cartInner.style.transform =
      `translateY(${-6 - over * over * 1500}px) scale(${1 - over * .25})`;
    cartInner.style.opacity = String(1 - over * .9);
  }

  // 16번에 들어서는 순간 개미와 카메라가 함께 멈춘다.
  // 그래야 카트만 올라가고 개미는 화면에 남아 올려다본다.
  if(b.finale){ if(groundHold === null) groundHold = cx; }
  else groundHold = null;
  const gx = groundHold !== null ? groundHold : cx;
  walkA.style.left = (gx - 110) + "px"; walkA.style.top = GROUND_Y + "px";
  walkB.style.left = (gx + 110) + "px"; walkB.style.top = GROUND_Y + "px";

  let cam = -(cx - CAM_X);
  if(b.finale){ if(camFreeze === null) camFreeze = cam; cam = camFreeze; }
  else camFreeze = null;
  cam = camera(cam);

  // 말풍선은 타고 있으면 카트 위, 서 있으면 개미 위
  const riding = b.rideA || b.rideB;
  // 구름 꼬리가 예전 삼각 꼬리보다 길어 그만큼 위로 올린다
  placeBubble(riding ? cx : gx, riding ? cy - 300 : GROUND_Y - 300, cam);

  if(t < TOTAL_MS + 1200) requestAnimationFrame(frame);
  else stage.classList.remove("shake");
}

/* ===========================================================================
   7. 시작 — 폰트와 이미지가 다 준비된 뒤에 튼다.
      중간에 스프라이트가 늦게 뜨면 녹화본을 다시 찍어야 한다.
   =========================================================================== */
function preload(){
  const keys = ["sit_02_hwanho","sit_03_bulan","sit_04_sasaek","sit_05_ando",
                "stand_01_gomin","stand_02_ppudeut","stand_03_mangyeon"];
  const jobs = [];
  for(const who of ["A","B"]) for(const k of keys){
    jobs.push(new Promise(res => {
      const im = new Image(); im.onload = im.onerror = res; im.src = sprite(who, k);
    }));
  }
  jobs.push(document.fonts ? document.fonts.ready : Promise.resolve());
  return Promise.race([Promise.all(jobs), new Promise(res => setTimeout(res, 6000))]);
}

// 손글씨 폰트가 뜨지 않으면 대체 폰트가 훨씬 넓어 한 줄에 안 들어간다.
// 폰트가 정해진 뒤 실제 폭을 재서 들어올 때까지 줄인다.
function fitOneLine(node, max, min, room){
  for(let size = max; size >= min; size -= 2){
    node.style.fontSize = size + "px";
    if(node.scrollWidth <= room) return;
  }
}

// 첫 프레임은 프리퀄의 시작 자세 — 300만 꼭대기에 개미를 태운 카트가 서 있다
(function initFirstFrame(){
  cart.style.offsetDistance = (D_PEAK / TOTAL * 100) + "%";
  setSprite(antA, "A", "sit_02_hwanho"); setSprite(antB, "B", "sit_02_hwanho");
  antA.style.opacity = antB.style.opacity = 1;
  walkA.style.display = walkB.style.display = "none";
  hush();
  camera(0);
})();
preload().then(() => {
  fitOneLine($("slogan"), 86, 44, W - 120);
  requestAnimationFrame(frame);
});

// 조작 UI 는 두지 않는다. 다시 보려면 아무데나 탭(또는 새로고침).
addEventListener("pointerdown", () => location.reload());
</script>
