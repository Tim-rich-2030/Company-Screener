<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>꾸중부자</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F5F2EC">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꾸중부자">
<style>
/* CLAUDE.md 디자인 규칙. 오래된 회계장부·신문 금융면의 톤.
   폰트·차트는 저장소 안(assets/)에서 부른다 — 바깥으로 요청이 나가면
   오프라인에서 앱이 반쪽이 되고 자체 완결 보장도 깨진다. */
@font-face{font-family:'Noto Serif KR';src:url('assets/fonts/noto-serif-kr-korean-400.woff2')
  format('woff2');font-weight:400;font-display:swap;unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7A3}
@font-face{font-family:'Noto Serif KR';src:url('assets/fonts/noto-serif-kr-latin-400.woff2')
  format('woff2');font-weight:400;font-display:swap;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Pretendard';src:url('assets/fonts/pretendard-400.woff2')
  format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Pretendard';src:url('assets/fonts/pretendard-600.woff2')
  format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('assets/fonts/ibm-plex-mono-400.woff2')
  format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'IBM Plex Mono';src:url('assets/fonts/ibm-plex-mono-500.woff2')
  format('woff2');font-weight:500;font-display:swap}

:root{
  --paper:#F5F2EC; --surface:#FFFDF8; --ink:#1C1A17; --ink-muted:#6B6558;
  --rule:#DED8CC; --accent:#2C4A45; --up:#C4443D; --down:#3D6099;
  /* 이동평균 — 20일 하늘색, 60일 파랑, 120일 갈색.
     60일선 파랑은 하락봉(--down)과 헷갈리지 않게 한 단계 더 진하게 잡았다. */
  --ma20:#63A6C8; --ma60:#1F4E9C; --ma120:#8B5E34;
}
/* 규칙에 다크는 네 가지만 정해져 있다. 나머지는 어두운 종이 위에서 읽히도록
   같은 계열에서 밝기만 올린 임시값이다. */
@media (prefers-color-scheme:dark){:root{
  --paper:#14130F; --surface:#1C1A16; --ink:#E8E3D8; --rule:#2E2B24;
  --ink-muted:#9A9384; --accent:#7FA89F; --up:#D9645C; --down:#6E8FC4;
  --ma20:#8FC4E0; --ma60:#6C97D8; --ma120:#B08050;
}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--paper);color:var(--ink);
  font:15px/1.6 'Pretendard',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
/* IBM Plex Mono 에는 한글이 없다. Pretendard 를 뒤에 둬야 한글만 시스템 모노로
   떨어지지 않는다. */
.num{font-family:'IBM Plex Mono','Pretendard',ui-monospace,monospace;
  font-variant-numeric:tabular-nums}
h1,h2{font-family:'Noto Serif KR',serif;font-weight:400}

#app{max-width:760px;margin:0 auto;
  padding:calc(18px + env(safe-area-inset-top)) 18px
          calc(28px + env(safe-area-inset-bottom))}

/* 제호 — 신문 1면 맨 위. 겹괘선(굵은 선 + 가는 선)이 옛 금융면의 표식이다. */
.head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;
  border-bottom:3px solid var(--ink)}
.head+.rule2{height:1px;background:var(--ink);opacity:.35;margin-bottom:0}
h1{font-size:22px;letter-spacing:1px}
.head .date{margin-left:auto;font-size:11.5px;color:var(--ink-muted);
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}

/* 머리 — 왼쪽에 오늘 이벤트, 오른쪽에 지수. 토스증권 '발견' 화면의 배치다.
   다만 칸을 나누는 것은 상자가 아니라 세로 괘선 하나다. */
.strip{display:flex;align-items:stretch;gap:14px;padding:11px 0 12px;
  border-bottom:1px solid var(--rule)}
.ev{flex:0 0 34%;max-width:142px;min-width:0;text-align:left;cursor:pointer;
  background:none;border:0;padding:0;font:inherit;color:inherit;
  border-right:1px solid var(--rule)}
.ev .k{font-size:10.5px;color:var(--ink-muted);letter-spacing:.3px}
.ev .v{font-family:'Noto Serif KR',serif;font-size:12.5px;line-height:1.35;
  margin-top:3px;padding-right:12px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.ev .d{font-size:10.5px;color:var(--ink-muted);margin-top:2px}
/* 지수는 옆으로 넘긴다. 다섯 개를 억지로 우겨넣으면 숫자가 깨진다. */
.idx{flex:1;min-width:0;display:flex;gap:15px;overflow-x:auto;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.idx::-webkit-scrollbar{display:none}
.idx button{flex:0 0 auto;min-width:92px;background:none;border:0;
  padding:0 0 3px;font:inherit;color:inherit;cursor:pointer;text-align:left;
  white-space:nowrap;border-bottom:2px solid transparent}
.idx button.on{border-bottom-color:var(--accent)}
.idx .k{font-size:10.5px;color:var(--ink-muted)}
.idx .v{font-size:13.5px;margin-top:2px;line-height:1.25}
.idx .c{font-size:11px;line-height:1.3}

/* 목차 — 어느 면이 있는지 위에 붙여 둔다. 스크롤해도 따라온다. */
.toc{position:sticky;top:0;z-index:20;background:var(--paper);
  display:flex;gap:15px;overflow-x:auto;scrollbar-width:none;
  padding:9px 0 8px;border-bottom:1px solid var(--rule);
  font-family:'Noto Serif KR',serif;font-size:12.5px}
.toc::-webkit-scrollbar{display:none}
.toc a{color:var(--ink-muted);text-decoration:none;white-space:nowrap;
  padding-bottom:2px;border-bottom:1px solid transparent}
.toc a.on{color:var(--ink);border-bottom-color:var(--accent)}
.toc .last{margin-left:auto;color:var(--accent)}

/* 섹션 사이는 박스가 아니라 여백과 괘선으로 가른다. 2px 괘선이 면의 시작이다. */
section{margin-top:36px;border-top:2px solid var(--rule);padding-top:13px;
  scroll-margin-top:44px}
h2{font-size:15px;letter-spacing:-.1px;display:flex;align-items:baseline;gap:8px}
h2 .no{font-size:12px;color:var(--ink-muted);letter-spacing:2px}
h2 .note{margin-left:auto;font-family:'Pretendard',sans-serif;font-size:11.5px;
  color:var(--ink-muted);font-weight:400;text-align:right}

/* 1면은 스크롤 없이 완결된다. 차트가 남는 높이를 먹고, 아래 세 줄은 고정. */
#today{margin-top:0;border-top:0;padding-top:0;
  min-height:calc(100dvh - 196px);display:flex;flex-direction:column}

/* 전환은 박스가 아니라 밑줄로 표시한다. */
.tabs{display:flex;gap:22px;padding:8px 0 0}
.tab{background:none;border:0;padding:6px 0;font:inherit;font-size:15px;
  color:var(--ink-muted);cursor:pointer;border-bottom:2px solid transparent;
  font-family:'Noto Serif KR',serif}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs.sm .tab{font-size:13.5px}

.legend{display:flex;gap:16px;font-size:11.5px;color:var(--ink-muted);
  padding:8px 0 2px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;
  margin-right:5px}
#chart{flex:1 1 0;min-height:170px}

/* 큰 숫자는 셋. 나머지는 아래 괘선 위 작은 글씨로. */
.figs{display:flex;gap:24px;padding:14px 0 12px;border-top:1px solid var(--rule)}
.fig{flex:1;min-width:0}
.fig .k{font-size:11px;color:var(--ink-muted);letter-spacing:.3px}
.fig .v{font-size:25px;line-height:1.2;margin-top:1px;letter-spacing:-.5px}
.fig .v .unit{font-size:14px;color:var(--ink-muted);margin-left:2px}

.u{color:var(--up)} .d{color:var(--down)}

/* 표 — 장부처럼 머리글을 한 번만 두고 숫자는 오른쪽으로 맞춘다.
   줄마다 'PBR 0.52 PER 2.89' 처럼 이름표를 반복하면 그 이름표가 숫자보다
   많아진다. 실제로 여덟 줄에 이름표가 스물넷이었다. */
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-family:'Pretendard',sans-serif;font-weight:400;font-size:11px;
  color:var(--ink-muted);text-align:right;padding:0 0 6px;
  border-bottom:1px solid var(--rule);white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px 0;border-bottom:1px solid var(--rule);text-align:right;
  white-space:nowrap}
.tbl td:first-child{text-align:left;width:99%;max-width:0;overflow:hidden;
  text-overflow:ellipsis;font-family:'Noto Serif KR',serif;font-size:14px}
.tbl td+td{padding-left:14px}
.tbl .mark{color:var(--accent);font-size:11px;margin-right:4px}

/* 종목 줄 — 순위 · 이름(+테마) · 이격 / 값들. 두 줄로 눕힌다.
   한 줄에 다 넣으면 종목명이 잘리고, 잘린 종목명은 아무 쓸모가 없다. */
.lst{font-size:13px}
.lst .r{display:flex;align-items:flex-start;gap:11px;width:100%;
  padding:10px 0;border-bottom:1px solid var(--rule);
  background:none;border-left:0;border-right:0;border-top:0;
  font:inherit;color:inherit;text-align:left;cursor:pointer}
.lst .no{flex:0 0 18px;color:var(--ink-muted);font-size:11.5px;padding-top:2px}
.lst .mid{flex:1;min-width:0}
.lst .nm{display:block;font-family:'Noto Serif KR',serif;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .sub{display:block;font-size:11.5px;color:var(--ink-muted);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst .rt{flex:0 0 auto;text-align:right}
.lst .gap{display:block;font-size:14px}
.lst .amt{display:block}
.lst .gap i{font-style:normal;font-size:10px;color:var(--ink-muted);
  margin-right:3px}
.lst .amt{font-size:11.5px;color:var(--ink-muted);margin-top:3px}
/* 테마 뱃지 — 상자가 아니라 괘선 하나로 두른다. */
.tag{display:inline-block;font-size:10.5px;line-height:1.5;padding:0 5px;
  margin-right:4px;color:var(--ink-muted);border:1px solid var(--rule);
  font-family:'Pretendard',sans-serif}
.why{font-size:11.5px;color:var(--ink-muted);padding:9px 0 0;line-height:1.65}

/* 종목 상세 — 아래에서 올라오는 장. 화면을 갈아엎지 않고 위에 덮는다. */
.sheet{position:fixed;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute;inset:0;background:rgba(0,0,0,.35)}
.sheet .card{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;
  overflow-y:auto;background:var(--paper);border-top:3px solid var(--ink);
  padding:0 18px calc(24px + env(safe-area-inset-bottom));
  max-width:760px;margin:0 auto}
.sheet .top{position:sticky;top:0;background:var(--paper);z-index:2;
  display:flex;align-items:baseline;gap:10px;padding:14px 0 10px;
  border-bottom:1px solid var(--rule)}
.sheet .top b{font-family:'Noto Serif KR',serif;font-weight:400;font-size:17px}
.sheet .top .x{margin-left:auto;background:none;border:0;font:inherit;
  font-size:20px;line-height:1;color:var(--ink-muted);cursor:pointer;padding:0 4px}
.sheet h3{font-family:'Noto Serif KR',serif;font-weight:400;font-size:13px;
  color:var(--ink-muted);margin:22px 0 8px;letter-spacing:.3px}
.sheet .line{height:240px;margin-top:2px}
.sheet .tabs{padding:10px 0 0}
.sheet .legend{padding:6px 0 2px}

/* 종목 뉴스 — 왼쪽 제목, 오른쪽 그림. 그림은 네이버 주소를 그대로 쓴다.
   오프라인이거나 주소가 죽으면 그 칸만 빈다 (onerror 로 지운다). */
.snews a{display:flex;align-items:flex-start;gap:11px;padding:10px 0;
  border-bottom:1px solid var(--rule);text-decoration:none;color:var(--ink)}
.snews a:visited .t{color:var(--ink-muted)}
.snews .t{flex:1;min-width:0;font-size:13.5px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden}
.snews .m{flex:0 0 auto;order:3;display:none}
.snews a{flex-wrap:wrap}
.snews .t{order:1}
.snews img{order:2;flex:0 0 62px;width:62px;height:62px;object-fit:cover;
  border:1px solid var(--rule)}
.snews .m{order:4;display:block;flex:0 0 100%;font-size:11px;
  color:var(--ink-muted);margin-top:-4px}
.kv{display:flex;flex-wrap:wrap;gap:0 22px}
.kv div{flex:1 0 40%;display:flex;justify-content:space-between;
  padding:7px 0;border-bottom:1px solid var(--rule);font-size:12.5px;gap:10px}
.kv span{color:var(--ink-muted)}
/* 순매수 — 개인과 외국인을 같은 자로 재야 길이가 뜻을 갖는다. */
.flow{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:12.5px}
.flow span{flex:0 0 44px;color:var(--ink-muted)}
.flow b{flex:0 0 92px;font-weight:400;text-align:right}
.flow .bar{flex:1;height:6px;background:var(--rule);position:relative}
.flow .bar i{position:absolute;top:0;bottom:0}

/* 일정 전체 보기 — 주별 / 월별 */
.ovl{position:fixed;inset:0;z-index:70;display:none;background:var(--paper);
  overflow-y:auto}
.ovl.on{display:block}
.ovl .in{max-width:760px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 18px
          calc(28px + env(safe-area-inset-bottom))}
.ovl .top{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;
  border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--paper)}
.ovl .top b{font-family:'Noto Serif KR',serif;font-weight:400;font-size:17px}
.ovl .top .x{background:none;border:0;font:inherit;font-size:20px;
  color:var(--ink-muted);cursor:pointer;padding:0 4px}
.mon{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:14px}
.mon td{border-top:1px solid var(--rule);vertical-align:top;padding:6px 3px 10px;
  width:20%;font-size:10.5px;line-height:1.45}
.mon .dn{font-size:12px;margin-bottom:4px;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.mon .dn.off{color:var(--ink-muted)}
.mon .dn.now{color:var(--accent)}
.mon em{font-style:normal;display:block;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;border-left:2px solid var(--rule);padding-left:4px;
  margin-bottom:3px}

/* 캘린더 — 날짜가 왼쪽 기둥이다. 오늘이 어디인지 목록 안에 선으로 긋는다. */
.cal{font-size:13px}
.cal .row{display:flex;align-items:baseline;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--rule)}
.cal .row.past{opacity:.5}
/* 다가온 것을 색으로 또 강조하지 않는다. '오늘' 선 바로 아래가 곧 다음 일이다.
   선과 색을 같이 쓰면 이 화면에서 강조색이 두 번 나온다. */
.cal .dd{flex:0 0 46px;color:var(--ink-muted)}
.cal .nm{font-family:'Noto Serif KR',serif;font-size:14px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis}
.cal .meta{color:var(--ink-muted);font-size:11.5px;white-space:nowrap}
.cal .now{display:flex;align-items:center;gap:9px;padding:5px 0;
  color:var(--accent);font-size:11px;letter-spacing:1px}
.cal .now::after{content:"";flex:1;height:1px;background:var(--accent)}
.cal .more{background:none;border:0;padding:8px 0;font:inherit;font-size:11.5px;
  color:var(--ink-muted);cursor:pointer;font-family:'Pretendard',sans-serif}

/* 조건에 걸린 종목 — 표가 아니라 괘선으로 나눈 줄 */
.rule-line{font-size:11.5px;color:var(--ink-muted);padding:8px 0 2px}
.pick{display:flex;align-items:baseline;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--rule)}
.pick .nm{font-family:'Noto Serif KR',serif;font-size:14.5px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .cd{font-size:11px;color:var(--ink-muted)}
.pick .vals{margin-left:auto;display:flex;gap:14px;font-size:12.5px;
  white-space:nowrap}
.pick .vals i{font-style:normal;color:var(--ink-muted);font-size:10.5px;
  margin-right:3px}

/* 시장 지도 */
#map{position:relative;width:100%;height:440px;margin-top:10px}
@media (min-width:520px){#map{height:520px}}
.tile{position:absolute;overflow:hidden;border:1px solid var(--paper);
  padding:3px 4px;line-height:1.15}
.tile b{display:block;font-weight:400;font-size:11px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile s{display:block;text-decoration:none;font-size:10.5px;opacity:.85;
  font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.scale{display:flex;align-items:center;gap:8px;font-size:11px;flex-wrap:wrap;
  color:var(--ink-muted);padding-top:9px}
.scale .bar{flex:1;height:6px;min-width:44px;max-width:170px}
.scale .num{white-space:nowrap}

/* 뉴스 */
.news a{display:block;padding:9px 0;border-bottom:1px solid var(--rule);
  color:var(--ink);text-decoration:none;font-size:13.5px;line-height:1.5}
.news a:visited{color:var(--ink-muted)}

footer{font-size:11px;color:var(--ink-muted);margin-top:32px;padding-top:9px;
  border-top:1px solid var(--rule);display:flex;gap:10px;flex-wrap:wrap}
.miss{font-size:12.5px;color:var(--ink-muted);padding:14px 0;line-height:1.7}
#err{padding:32px 0;font-size:13.5px;color:var(--ink-muted);line-height:1.9}
</style>
</head>
<body>
<div id="app">
  <div class="head">
    <h1>꾸중부자</h1>
    <span class="date" id="masthead-date"></span>
  </div>
  <div class="rule2"></div>

  <!-- 머리 — 왼쪽 오늘 이벤트, 오른쪽 지수 다섯. 지수를 누르면 아래 차트가 바뀐다. -->
  <div class="strip">
    <button class="ev" id="ev"><div class="k">오늘 이벤트</div>
      <div class="v">–</div><div class="d"></div></button>
    <div class="idx" id="idx"></div>
  </div>

  <nav class="toc" id="toc">
    <a href="#today">오늘</a><a href="#strong">실시간</a><a href="#picks">조건</a>
    <a href="#tree">지도</a><a href="#cal">일정</a><a href="#news">뉴스</a>
    <a href="#macro">기록</a><a href="#etf">참고</a>
    <a class="last" href="stocks.html">종목 실적 ›</a>
  </nav>

  <!-- 1면 — 고른 지수가 어디쯤인가. -->
  <section id="today">
    <div class="legend" id="legend"></div>
    <div id="chart"></div>
    <div class="figs" id="figs"></div>
  </section>

  <div class="card" id="sheet-card"></div></div>

<!-- 일정 전체 — 머리의 '오늘 이벤트' 를 누르면 열린다. -->
<div class="ovl" id="ovl"><div class="in">
  <div class="top"><b>일정</b>
    <div class="tabs sm" id="ovl-tabs" style="padding:0"></div>
    <button class="x" data-close="1" style="margin-left:auto">✕</button></div>
  <div id="ovl-body"></div>
</div></div>

<script src="assets/vendor/lightweight-charts.standalone.production.js"></script>
<script>
"use strict";
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g,
  function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var num = function(v, d){ return v === null || v === undefined ? '–'
  : v.toLocaleString('ko-KR', {minimumFractionDigits:d, maximumFractionDigits:d}); };
var signed = function(v, d){ return v === null || v === undefined ? '–'
  : (v > 0 ? '+' : '') + v.toFixed(d); };
// 주가는 오르면 빨강 내리면 파랑 — 국내 관례
var cls = function(v){ return v === null || v === undefined ? ''
  : v > 0 ? 'u' : v < 0 ? 'd' : ''; };
var cssVar = function(n){ return getComputedStyle(document.documentElement)
  .getPropertyValue(n).trim(); };
var MAS = [[20, '--ma20'], [60, '--ma60'], [120, '--ma120']];

// =============================================================================
// 지수 — 봉차트 + 이동평균
// =============================================================================
var DATA = null, NAMES = [], CUR = null, chart = null, ro = null;

function toTime(s){
  return {year:+s.slice(0,4), month:+s.slice(4,6), day:+s.slice(6,8)};
}
// 저장값은 [시가,고가,저가,종가]. 종가 하나만 담던 예전 파일도 읽히게 둔다.
function bar(v){
  return Array.isArray(v) ? {o:v[0], h:v[1], l:v[2], c:v[3]}
                          : {o:v, h:v, l:v, c:v};
}
function sma(rows, w){
  var out = [], sum = 0;
  for (var i = 0; i < rows.length; i++){
    sum += rows[i].close;
    if (i >= w) sum -= rows[i - w].close;
    if (i >= w - 1) out.push({time: rows[i].time, value: sum / w});
  }
  return out;
}

/* 해외 지수는 종가만 온다. 봉을 그릴 수 없으니 선으로 그리고 그렇다고 적는다. */
function drawWorld(s){
  var el = $('chart');
  if (chart){ chart.remove(); chart = null; }
  el.innerHTML = '';
  $('figs').innerHTML =
    fig('종가', num(s.last, 2), '') +
    fig('전일 대비', s.chg === null ? '–' : signed(s.chg, 2) + '%', cls(s.chg));
  if (!window.LightweightCharts || (s.points || []).length < 2) return;
  var muted = cssVar('--ink-muted'), rule = cssVar('--rule');
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: el.clientHeight,
    layout: {background:{color:'transparent'}, textColor: muted,
             fontFamily:"'IBM Plex Mono', monospace", fontSize:10},
    grid: {vertLines:{visible:false}, horzLines:{color: rule}},
    rightPriceScale:{borderColor: rule}, timeScale:{borderColor: rule},
    crosshair:{mode:1}, handleScroll:true, handleScale:true,
  });
  chart.addLineSeries({color: cssVar('--accent'), lineWidth:2,
    priceLineVisible:false}).setData(s.points.map(function(p){
      return {time: toTime(p[0]), value: p[1]}; }));
  if (ro) ro.disconnect();
  ro = new ResizeObserver(function(){
    if (chart) chart.applyOptions({width: el.clientWidth, height: el.clientHeight});
  });
  ro.observe(el);
}

function draw(name){
  CUR = name;
  renderTabs();
  var w = worldOf(name);
  if (w) return drawWorld(w);
  var series = (DATA.series || {})[name] || {};
  var rows = Object.keys(series).sort().map(function(d){
    var b = bar(series[d]);
    return {time: toTime(d), open:b.o, high:b.h, low:b.l, close:b.c};
  });
  if (chart){ chart.remove(); chart = null; }
  var el = $('chart'); el.innerHTML = '';
  renderNumbers(name);
  if (!window.LightweightCharts || rows.length < 2) return;

  var muted = cssVar('--ink-muted'), rule = cssVar('--rule');
  chart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: el.clientHeight,
    layout: {background:{color:'transparent'}, textColor: muted,
             fontFamily:"'IBM Plex Mono', monospace", fontSize:10},
    grid: {vertLines:{visible:false}, horzLines:{color: rule}},
    rightPriceScale: {borderColor: rule},
    timeScale: {borderColor: rule},
    crosshair: {mode: 1},
    // 손으로 밀고 확대할 수 있어야 한다. 잠가두면 차트가 그림이 된다.
    handleScroll: true, handleScale: true,
  });
  var cs = chart.addCandlestickSeries({
    upColor: cssVar('--up'), downColor: cssVar('--down'),
    borderUpColor: cssVar('--up'), borderDownColor: cssVar('--down'),
    wickUpColor: cssVar('--up'), wickDownColor: cssVar('--down'),
  });
  cs.setData(rows);
  MAS.forEach(function(p){
    var data = sma(rows, p[0]);
    if (data.length < 2) return;
    chart.addLineSeries({color: cssVar(p[1]), lineWidth:2,
      priceLineVisible:false, lastValueVisible:false,
      crosshairMarkerVisible:false}).setData(data);
  });
  // 최근 120거래일만 먼저 보여준다. 3년을 다 펼치면 봉이 실선으로 뭉갠다.
  chart.timeScale().setVisibleLogicalRange(
    {from: Math.max(0, rows.length - 120), to: rows.length + 2});

  if (ro) ro.disconnect();
  ro = new ResizeObserver(function(){
    if (chart) chart.applyOptions({width: el.clientWidth, height: el.clientHeight});
  });
  ro.observe(el);
}

// =============================================================================
// 머리의 지수 다섯 — 코스피·코스닥은 우리가 받은 봉, 해외 셋은 FRED 종가.
//
// 해외는 **하루 늦다.** 미국 장이 새벽에 끝나고 FRED 에 올라오기까지 시차가
// 있다. 같은 줄에 세워 두면 같은 날짜로 읽히므로 날짜를 함께 적는다.
// =============================================================================
var WORLD = null;

function worldOf(key){
  var all = (WORLD && WORLD.series) || [];
  for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
  return null;
}

/* 지수의 전일 대비. computed 에는 이격도만 있어서 종가 두 개로 직접 낸다. */
function idxChange(name){
  var s = (DATA && DATA.series || {})[name] || {};
  var ks = Object.keys(s).sort();
  if (ks.length < 2) return null;
  var a = bar(s[ks[ks.length - 2]]).c, b = bar(s[ks[ks.length - 1]]).c;
  return a ? (b - a) / a * 100 : null;
}

function strip(){
  var out = [];
  NAMES.forEach(function(n){
    var d = (DATA.computed || DATA).indices[n];
    out.push({key: n, name: n, last: d.close, chg: idxChange(n), krx: true});
  });
  ((WORLD && WORLD.series) || []).forEach(function(s){
    out.push({key: s.key, name: s.name, last: s.last, chg: s.chg,
              date: s.date, krx: false});
  });
  return out;
}

function renderStrip(){
  $('idx').innerHTML = strip().map(function(s){
    return '<button data-k="' + esc(s.key) + '"' +
      (s.key === CUR ? ' class="on"' : '') + '><div class="k">' + esc(s.name) +
      '</div><div class="v num">' + num(s.last, 2) + '</div>' +
      '<div class="c num ' + cls(s.chg) + '">' +
      (s.chg === null ? '–' : signed(s.chg, 2) + '%') + '</div></button>';
  }).join('');
}

function renderTabs(){
  renderStrip();
  $('legend').innerHTML = worldOf(CUR)
    ? '<span>' + esc(worldOf(CUR).note || '') + ' · ' +
      ymd(worldOf(CUR).date) + ' 기준 — 우리 장보다 하루 늦게 옵니다</span>'
    : MAS.map(function(p){
        return '<span><i style="background:var(' + p[1] + ')"></i>' + p[0] +
               '일선</span>'; }).join('');
}

function fig(k, v, c, unit){
  return '<div class="fig"><div class="k">' + k + '</div><div class="v num ' +
    (c || '') + '">' + v + (unit ? '<span class="unit">' + unit + '</span>' : '') +
    '</div></div>';
}

function renderNumbers(name){
  var r = DATA.computed || DATA;
  var d = r.indices[name];
  // 차트 아래에는 둘만 둔다. 백분위·밴드·추세를 같이 늘어놓으면 눈이 어디로
  // 갈지 정해지지 않는다.
  $('figs').innerHTML =
    fig('종가', num(d.close, 2), '') +
    fig('20일선 이격도', signed(d.disparity, 2) + '%', cls(d.disparity));

  var a = r.as_of;
  $('masthead-date').textContent = ymd(a);
  $('foot').innerHTML =
    '<span class="num">' + ymd(a) + '</span> 종가 기준' +
    (r.source ? ' · ' + esc(r.source) : '') +
    '<span style="margin-left:auto">차트: TradingView Lightweight Charts™</span>';
}

$('idx').addEventListener('click', function(e){
  var b = e.target.closest('button');
  if (b && b.dataset.k !== CUR) draw(b.dataset.k);
});

// =============================================================================
// 조건에 걸린 종목
// =============================================================================
var PICKS_SHOWN = 8, PICKS = null;

/* 어제 목록과 견준 결과를 한 마디로. 첫 실행이면 '같음'이라고 하지 않는다 —
   견줄 것이 없는 것과 안 바뀐 것은 다른 말이다. */
function picksDelta(p){
  var c = p && p.changed;
  if (!c) return {txt: '견줄 이전 기록이 아직 없습니다', kept: true};
  var n = (c['new'] || []).length, g = (c.gone || []).length;
  if (!n && !g) return {txt: '직전 수집일과 같습니다', kept: true};
  var parts = [];
  if (n) parts.push('새로 ' + n + '종목');
  if (g) parts.push('빠진 것 ' + g + '종목');
  return {txt: parts.join(' · '), kept: false,
          names: (c['new'] || []).map(function(x){ return x.name; })};
}

function renderPicks(p){
  PICKS = p;
  var items = p.items || [];
  var d = picksDelta(p);
  $('picks-note').innerHTML = p.screened + '종목 중 ' + items.length + '개<br>' +
    (d.kept ? '' : '<em style="font-style:normal;color:var(--accent)">') +
    esc(d.txt) + (d.kept ? '' : '</em>');
  var rule = '조건 — ' + (p.rule || '');
  var c = p.changed;
  if (c && (c.gone || []).length){
    rule += '<br>' + ymd(c.since) + ' 뒤 빠진 것 — ' +
      c.gone.map(function(x){ return esc(x.name); }).join(', ');
  }
  $('picks-rule').innerHTML = rule;
  if (!items.length){
    $('picks-list').innerHTML =
      '<div class="miss">오늘 이 조건을 모두 만족하는 종목이 없습니다.</div>';
    return;
  }
  // 새로 들어온 종목에 표를 단다. 목록만 보면 무엇이 바뀌었는지 알 수 없다.
  var fresh = {};
  ((c && c['new']) || []).forEach(function(x){ fresh[x.code] = 1; });

  var labels = p.labels || [];
  var head = '<tr><th>종목</th>' + labels.map(function(l){
    return '<th>' + esc(l) + '</th>'; }).join('') + '</tr>';
  var body = items.slice(0, PICKS_SHOWN).map(function(h){
    var tds = (h.values || []).map(function(v){
      return '<td class="num">' +
        (v === null || v === undefined ? '–' : v.toFixed(2)) + '</td>';
    }).join('');
    return '<tr><td>' + (fresh[h.code] ? '<span class="mark">신규</span>' : '') +
      esc(h.name) + '</td>' + tds + '</tr>';
  }).join('');
  $('picks-list').innerHTML =
    '<table class="tbl"><thead>' + head + '</thead><tbody>' + body +
    '</tbody></table>' + (items.length > PICKS_SHOWN
      ? '<div class="rule-line">' + (items.length - PICKS_SHOWN) +
        '개 더 — <a href="stocks.html" style="color:var(--accent)">종목 실적</a>' +
        '에서 전체를 볼 수 있습니다</div>' : '');
}

// =============================================================================
// 캘린더 — 실적 마감과 통화정책 회의
// =============================================================================
function dday(n){
  return n === 0 ? '오늘' : n > 0 ? 'D-' + n : 'D+' + (-n);
}
function ymd(s){
  return s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6,8);
}

var CAL = null, CAL_ALL = false;
var PAST_SHOWN = 2;      // 지난 일정은 최근 두 개만. 나머지는 접어 둔다.

function calRow(r){
  var soon = r.n >= 0 && r.n <= 7;
  return '<div class="row' + (r.n < 0 ? ' past' : '') + (soon ? ' soon' : '') +
    '"><span class="dd num">' + dday(r.n) + '</span>' +
    '<span class="nm">' + esc(r.k) + '</span>' +
    '<span class="meta num">' + ymd(r.d).slice(5) +
    (r.v ? ' · ' + r.v : '') + '</span></div>';
}

/* 실적 마감과 회의 일정을 한 줄기로 모아 날짜순으로. 1면도 이 목록을 쓴다. */
function calRows(c){
  var rows = [];
  ((c && c['실적']) || []).forEach(function(r){
    // 마감이 이미 지났고 대부분 제출했으면 그 시즌은 끝난 것이다. 굳이 안 띄운다.
    if (r.dday < 0 && r.total && r.filed / r.total > 0.9) return;
    // '0/292곳' 만 있으면 무엇이 0 인지 알 수 없다. 무엇을 센 숫자인지 붙인다.
    var done = r.total ? r.filed + '/' + r.total + '곳 수집' : '';
    rows.push({d: r.deadline, k: r.period + ' 마감', v: done, n: r.dday});
  });
  ((c && c['일정']) || []).forEach(function(e){
    rows.push({d: e.date, k: e.name, v: '', n: e.dday});
  });
  return rows.sort(function(a, b){ return a.d < b.d ? -1 : 1; });
}

function renderCal(c){
  CAL = c;
  var rows = calRows(c);
  if (!rows.length){
    $('cal-list').innerHTML = '<div class="miss">일정을 받지 못했습니다.</div>';
    return;
  }
  // 지난 것과 다가올 것을 가르고 그 사이에 오늘을 긋는다. 섞여 있으면
  // 250일 전에 끝난 회의가 목록 맨 위에 앉아 다음 마감을 가린다.
  var past = rows.filter(function(r){ return r.n < 0; });
  var next = rows.filter(function(r){ return r.n >= 0; });
  var hid = Math.max(0, past.length - PAST_SHOWN);
  var shown = CAL_ALL ? past : past.slice(-PAST_SHOWN);

  $('cal-list').innerHTML =
    (hid && !CAL_ALL ? '<button class="more" id="cal-more">지난 일정 ' + hid +
       '건 더 보기</button>' : '') +
    shown.map(calRow).join('') +
    '<div class="now">오늘' + (c.as_of ? ' ' + ymd(c.as_of) : '') + '</div>' +
    (next.length ? next.map(calRow).join('')
                 : '<div class="rule-line">앞으로 예정된 일정이 없습니다.</div>');
  var mb = $('cal-more');
  if (mb) mb.addEventListener('click', function(){ CAL_ALL = true; renderCal(c); });
  renderEv();

  $('cal-note').textContent = next.length ? '다가올 ' + next.length + '건' : '';
  var why = c.note || '';
  if (c.failed && c.failed.length){
    why += ' · ' + c.failed.join(', ') + ' 일정은 받지 못해 비어 있습니다.';
  }
  $('cal-why').textContent = why;
}

// =============================================================================
// 시장 지도 (트리맵)
// =============================================================================
var TREE = null, TREE_VIEW = null;   // 첫 탭은 데이터가 오면 정한다

// 시총이 넓이, 등락률이 색. 색은 종이색에서 상승/하락색 쪽으로 섞는다.
//
// 색이 가장 진해지는 지점은 **그날 분포에서** 정한다. 처음엔 ±3% 로 못박았는데,
// 시장 전체가 20~30% 움직인 날 지도가 통째로 한 덩어리 빨강이 됐다. 눈금이
// 고정이면 큰 장에서 아무것도 못 읽는다. 대신 눈금이 날마다 달라지므로
// 실제 범위를 범례에 적는다.
var TINT_PCTILE = 0.85;   // 이 백분위의 변동폭에서 색이 가장 진해진다
var TINT_MIN = 1.5, TINT_CAP = 30;

function tintSpan(rows){
  var m = rows.map(function(r){ return Math.abs(r.chg) || 0; })
              .sort(function(a, b){ return a - b; });
  if (!m.length) return TINT_MIN;
  var v = m[Math.min(m.length - 1, Math.floor(m.length * TINT_PCTILE))];
  return Math.max(TINT_MIN, Math.min(TINT_CAP, v));
}

function hex(v){
  var h = v.replace('#','');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16),
          parseInt(h.slice(4,6),16)];
}
function mix(a, b, t){
  return [0,1,2].map(function(i){ return Math.round(a[i] + (b[i]-a[i])*t); });
}
function tint(chg, base, up, down, span){
  if (!chg) return {bg: base, fg: null};
  var t = Math.min(1, Math.abs(chg)/span) * 0.88 + 0.12;
  var c = mix(base, chg > 0 ? up : down, t);
  // 타일이 진해지면 검은 글씨가 안 읽힌다. 밝기로 글자색을 뒤집는다.
  var lum = (c[0]*299 + c[1]*587 + c[2]*114) / 1000;
  return {bg: c, fg: lum < 140 ? '#FFFDF8' : null};
}
function rgb(c){ return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }

/*
 * Squarified treemap (Bruls·Huizing·van Wijk).
 * 남은 사각형의 짧은 변에 줄을 채우고, 타일이 정사각형에서 멀어지기 시작하면
 * 줄을 끊는다. 단순히 순서대로 자르면(slice-and-dice) 실처럼 가늘고 긴 타일이
 * 나와 글자가 안 들어간다.
 */
function squarify(items, X, Y, W, H){
  var out = [], rest = items.slice();
  var total = rest.reduce(function(s, i){ return s + i.v; }, 0);
  if (!(total > 0) || W <= 0 || H <= 0) return out;
  var scale = (W * H) / total;
  var x = X, y = Y, w = W, h = H;

  function worst(row, sum, side){
    var mx = 0, mn = Infinity;
    for (var i = 0; i < row.length; i++){
      if (row[i] > mx) mx = row[i];
      if (row[i] < mn) mn = row[i];
    }
    var s2 = sum * sum, d2 = side * side;
    return Math.max(d2 * mx / s2, s2 / (d2 * mn));
  }

  while (rest.length){
    var side = Math.min(w, h);
    var row = [], areas = [], sum = 0, best = Infinity;
    while (rest.length){
      var a = rest[0].v * scale;
      var w2 = worst(areas.concat([a]), sum + a, side);
      if (areas.length && w2 > best) break;
      best = w2; sum += a; areas.push(a); row.push(rest.shift());
    }
    var thick = sum / side;                 // 줄의 두께
    var horizontal = (w >= h);              // 짧은 변이 세로면 세로로 쌓는다
    var off = 0;
    for (var i = 0; i < row.length; i++){
      var len = areas[i] / thick;
      out.push(horizontal
        ? {it: row[i], x: x, y: y + off, w: thick, h: len}
        : {it: row[i], x: x + off, y: y, w: len, h: thick});
      off += len;
    }
    if (horizontal){ x += thick; w -= thick; }
    else           { y += thick; h -= thick; }
    if (w < 0.5 || h < 0.5) break;
  }
  return out;
}

/*
 * 넓이는 시가총액의 **제곱근**에 비례시킨다.
 *
 * 그대로 쓰면 SK하이닉스(1,255조) 하나가 지도의 3분의 1을 먹고, 서른 번째
 * 종목은 20×20px 이 된다. 이름을 다 넣는 것이 산술적으로 불가능하다 —
 * 실제로 시도해 보니 타일이 6개까지 줄었다.
 *
 * 제곱근을 쓰면 '큰 것이 크다'는 순서는 그대로 두면서 격차만 눌린다. 대신
 * 넓이를 두 배로 읽으면 시총은 네 배라는 뜻이므로, 범례에 눈금을 적는다.
 */
function area(cap){ return Math.sqrt(Math.max(0, cap)); }

var MIN_TILES = 8;

/*
 * 이름이 잘리는 타일이 없어질 때까지 개수를 줄인다.
 *
 * 폭을 px 로 어림잡는 방법도 써 봤는데, 한글 이름은 글자 수에 따라 필요한
 * 폭이 제각각이라 어림이 잘 맞지 않았다. 그려 놓고 실제로 잘렸는지(scrollWidth)
 * 재는 편이 정확하다. 뷰를 바꿀 때만 도는 계산이라 몇 번 다시 그려도 된다.
 */
function truncated(){
  var t = document.querySelectorAll('.tile b'), n = 0;
  for (var i = 0; i < t.length; i++){
    if (t[i].scrollWidth > t[i].clientWidth + 1 ||
        t[i].parentNode.clientHeight < 24) n++;
  }
  return n;
}

function renderTree(){
  if (!TREE) return;
  var el = $('map');
  var W = el.clientWidth, H = el.clientHeight;
  if (!W || !H) return;

  var rows, note, breadth = TREE.breadth || {};
  if (TREE_VIEW === '섹터순'){
    // 업종은 수가 적어 다 들어간다. 넓은 것부터 놓아야 타일이 반듯하다.
    rows = (TREE.sectors || []).filter(function(s){ return s.cap > 0; })
             .map(function(s){ return {v:area(s.cap), chg:s.chg, name:s.name}; })
             .sort(function(a, b){ return b.v - a.v; });
    note = function(n){ return n + ' / ' + rows.length + '개 업종'; };
  } else {
    var mk = (TREE.markets || {})[TREE_VIEW] || {};
    breadth = mk.breadth || breadth;
    // 시총 상위부터 후보로 삼되, 놓기는 많이 오른 것부터 — 상승순이니까.
    rows = (mk.items || []).map(function(i){
      return {v:area(i.cap), chg:i.chg, name:i.name}; });
    var total = (mk.breadth || {}).total || rows.length;
    note = function(n){
      return '시총 상위 ' + n + ' / ' + total + '종목 · 많이 오른 것부터'; };
  }
  if (!rows.length){
    el.innerHTML = '<div class="miss">이 시장의 종목이 없습니다.</div>';
    return;
  }

  var base = hex(cssVar('--surface')), up = hex(cssVar('--up')),
      down = hex(cssVar('--down')), span = 1;

  function paint(n){
    var use = rows.slice(0, n);
    span = tintSpan(use);
    el.innerHTML = squarify(use, 0, 0, W, H).map(function(r){
      var t = tint(r.it.chg, base, up, down, span);
      var style = 'left:' + r.x.toFixed(1) + 'px;top:' + r.y.toFixed(1) +
        'px;width:' + r.w.toFixed(1) + 'px;height:' + r.h.toFixed(1) +
        'px;background:' + rgb(t.bg) + (t.fg ? ';color:' + t.fg : '');
      return '<div class="tile" style="' + style + '" title="' + esc(r.it.name) +
        ' ' + signed(r.it.chg, 2) + '%"><b>' + esc(r.it.name) + '</b><s>' +
        signed(r.it.chg, 1) + '%</s></div>';
    }).join('');
  }

  // 후보 160개에서 한 번에 10%씩 줄이면 폰에서는 반복 한도에 먼저 걸린다.
  // (실제로 'DL이앤씨'가 잘린 채로 남았다.) 넓이로 대충 몇 개가 들어갈지
  // 어림잡아 그 근처에서 시작하고, 거기서부터 다듬는다.
  var n = Math.max(MIN_TILES,
                   Math.min(rows.length, Math.floor(W * H / 2600)));
  var guard = 0, bad;
  paint(n);
  // 줄인 뒤에는 반드시 그 개수로 다시 그린다. 그리기 전에 반복이 끝나면
  // 화면의 타일 수와 위에 적은 숫자가 어긋난다.
  while ((bad = truncated()) && n > MIN_TILES && guard++ < 40){
    // 많이 잘렸으면 크게, 조금 잘렸으면 조금 줄인다.
    n = Math.max(MIN_TILES,
                 n - Math.max(1, Math.round(n * (bad > n / 3 ? 0.3 : 0.1))));
    paint(n);
  }

  var b = breadth;
  $('tree-note').textContent = note(n);
  $('tree-scale').innerHTML =
    // 넓이가 시총에 그대로 비례하지 않는다는 것을 적는다. 안 적으면 넓이 두 배를
    // 시총 두 배로 읽는다.
    '<span style="white-space:nowrap">넓이=√시총 · 색=등락률</span>' +
    '<span class="bar" style="background:linear-gradient(90deg,' +
      rgb(mix(base, down, 1)) + ',' + rgb(base) + ',' + rgb(mix(base, up, 1)) +
      ')"></span>' +
    // 눈금이 날마다 바뀌므로 그날 값을 그대로 적는다. 안 적으면 어제와 오늘의
    // 같은 빨강이 같은 뜻인 줄 알게 된다.
    '<span class="num">' + signed(-span, span < 10 ? 1 : 0) + '% ~ ' +
      signed(span, span < 10 ? 1 : 0) + '%</span>' +
    (b.total ? '<span style="margin-left:auto">' + b.total +
      '종목 중 <b class="u">↑' + b.up + '</b> <b class="d">↓' + b.down +
      '</b></span>' : '');

  var u = TREE.universe;
  if (u && u.cut){
    // 무엇이 왜 빠졌는지 적는다. 조용히 빼면 지도가 시장 전체로 읽힌다.
    var why = Object.keys(u.cut).filter(function(k){ return u.cut[k]; })
                .map(function(k){ return k + ' ' + u.cut[k]; }).join(' · ');
    $('tree-why').textContent = why
      ? '전체 ' + u.seen + '종목에서 ' + why + ' 제외 → ' + u.kept + '종목' : '';
  }
}

function treeViews(){
  return Object.keys((TREE && TREE.markets) || {}).concat(['섹터순']);
}
function renderTreeTabs(){
  $('tree-tabs').innerHTML = treeViews().map(function(n){
    return '<button class="tab' + (n === TREE_VIEW ? ' on' : '') +
      '" data-v="' + esc(n) + '">' + esc(n) + '</button>'; }).join('');
}
$('tree-tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab');
  if (b && b.dataset.v !== TREE_VIEW){
    TREE_VIEW = b.dataset.v; renderTreeTabs(); renderTree();
  }
});

// =============================================================================
// 지표 기록 — 흐름 · 사건 · 이후
//
// 판단하지 않는다. "인하 9회 중 20거래일 뒤 상승 6회, 중앙값 +2.1%" 까지만
// 적는다. 표본 수를 반드시 붙인다 — 표본 없는 확률은 확신만 준다.
// =============================================================================
var MACRO = null, MACRO_KEY = null, mchart = null, mro = null;

function macroPick(){
  var all = (MACRO && MACRO.series) || [];
  for (var i = 0; i < all.length; i++){
    if (all[i].key === MACRO_KEY) return all[i];
  }
  return all[0] || null;
}

function renderMacro(){
  if (!MACRO) return;
  var all = (MACRO.series || []).filter(function(s){ return s.points.length; });
  if (!all.length){ hide('macro', '지표 기록'); return; }
  if (!MACRO_KEY) MACRO_KEY = all[0].key;
  $('macro-tabs').innerHTML = all.map(function(s){
    return '<button class="tab' + (s.key === MACRO_KEY ? ' on' : '') +
      '" data-v="' + esc(s.key) + '">' + esc(s.name) + '</button>'; }).join('');

  var s = macroPick();
  var last = s.events && s.events.length ? s.events[s.events.length - 1] : null;
  $('macro-figs').innerHTML =
    fig('현재', num(s.last, s.unit === '원' ? 0 : 2), '', s.unit) +
    (last ? fig('마지막 ' + last.dir,
                signed(last.to - last.from, 2) + 'p',
                last.dir === '인상' ? 'u' : 'd')
          : fig('기간', (s.span ? s.span[0].slice(0,4) + '~' : ''), '')) +
    // 연도까지 넣으면 폰에서 줄이 넘어간다. 연도는 바로 아래 목록에 있다.
    (last ? fig('그날', ymd(last.date).slice(5), '') : '');
  $('macro-note').textContent = s.note || '';

  // 차트 — 계단(금리)과 선(환율·유가)을 같은 방식으로 그린다.
  if (mchart){ mchart.remove(); mchart = null; }
  var el = $('macro-chart');
  el.innerHTML = '';
  el.style.height = '190px';
  if (window.LightweightCharts && s.points.length > 1){
    var muted = cssVar('--ink-muted'), rule = cssVar('--rule');
    mchart = LightweightCharts.createChart(el, {
      width: el.clientWidth, height: el.clientHeight,
      layout: {background:{color:'transparent'}, textColor: muted,
               fontFamily:"'IBM Plex Mono', monospace", fontSize:10},
      grid: {vertLines:{visible:false}, horzLines:{color: rule}},
      rightPriceScale:{borderColor: rule}, timeScale:{borderColor: rule},
      crosshair:{mode:1}, handleScroll:true, handleScale:true,
    });
    mchart.addLineSeries({
      color: cssVar('--accent'), lineWidth: 2,
      lineType: s.events && s.events.length ? 1 : 0,   // 1 = 계단
      priceLineVisible:false, lastValueVisible:true,
    }).setData(s.points.map(function(p){
      return {time: toTime(p[0]), value: p[1]}; }));
    if (mro) mro.disconnect();
    mro = new ResizeObserver(function(){
      if (mchart) mchart.applyOptions({width: el.clientWidth,
                                       height: el.clientHeight}); });
    mro.observe(el);
  }

  var evs = (s.events || []).slice().reverse().slice(0, 5);
  $('macro-events').innerHTML = evs.length ? evs.map(function(e){
    return '<div class="pick"><span class="nm">' + esc(e.dir) + '</span>' +
      '<span class="cd num">' + ymd(e.date) + '</span>' +
      '<span class="vals"><span class="num">' + e.from + ' → ' + e.to +
      esc(s.unit) + '</span><span class="num ' +
      (e.dir === '인상' ? 'u' : 'd') + '">' + signed(e.to - e.from, 2) +
      'p</span></span></div>'; }).join('')
    : '<div class="rule-line">이 지표는 값이 계속 움직여 ‘사건’을 따로 잡지 않습니다.</div>';

  // 이후 기록 — 서술만. 표본 수를 반드시 붙인다.
  var lines = [];
  Object.keys(s.after || {}).forEach(function(dir){
    var row = s.after[dir];
    Object.keys(row.spans).forEach(function(n){
      var v = row.spans[n];
      lines.push(dir + ' 뒤 ' + n + '거래일 — 코스피 상승 ' + v['상승'] + '/' +
                 v['표본'] + '회, 중앙값 ' + signed(v['중앙값'], 2) + '%');
    });
  });
  $('macro-after').innerHTML = lines.length
    ? esc('과거 기록 · ') + lines.map(esc).join('<br>')
    : '표본이 3회도 안 돼 이후 기록은 적지 않습니다.';
}

$('macro-tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab');
  if (b && b.dataset.v !== MACRO_KEY){ MACRO_KEY = b.dataset.v; renderMacro(); }
});

// =============================================================================
// ETF — 거래대금순 / 거래량순
//
// '많이 사는 순'은 아직 못 만든다. 거래대금은 사고판 것을 합친 값이라
// 순매수와 다르다. 여기서는 있는 그대로 '거래대금순'이라고 적는다.
// =============================================================================
var ETF = null, ETF_VIEW = null;

function etfViews(){ return ['거래대금순', '거래량순']; }

function renderEtf(){
  if (!ETF) return;
  $('etf-tabs').innerHTML = etfViews().map(function(n){
    return '<button class="tab' + (n === ETF_VIEW ? ' on' : '') +
      '" data-v="' + esc(n) + '">' + esc(n) + '</button>'; }).join('');
  var rows = ETF[ETF_VIEW] || [];
  if (!rows.length){ hide('etf', 'ETF'); return; }
  var big = ETF_VIEW === '거래대금순';
  $('etf-note').textContent = (ETF.counted ? ETF.counted['전체'] + '종목 중 거래된 '
    + ETF.counted['거래된 것'] + '개에서' : '') + ' 상위 ' + Math.min(rows.length, 8);
  $('etf-list').innerHTML = '<table class="tbl"><thead><tr><th>종목</th>' +
    '<th>등락률</th><th>' + (big ? '거래대금' : '거래량') + '</th></tr></thead><tbody>' +
    rows.slice(0, 8).map(function(e){
      var amt = big ? (e.val / 1e8).toLocaleString('ko-KR', {maximumFractionDigits:0}) + '억'
                    : (e.vol / 1e4).toLocaleString('ko-KR', {maximumFractionDigits:0}) + '만주';
      return '<tr><td>' + esc(e.name) + '</td><td class="num ' + cls(e.chg) + '">' +
        signed(e.chg, 2) + '%</td><td class="num">' + amt + '</td></tr>';
    }).join('') + '</tbody></table>' +
    // 상위를 레버리지·인버스가 차지하는 날이 많다. 걸러내면 '상위'가 거짓이 되므로
    // 그대로 두고 무엇을 보고 있는지만 적는다.
    '<div class="rule-line">지수를 두 배로 따라가거나 거꾸로 가는 상품이 ' +
    '상위에 함께 들어옵니다. 어느 갈래가 움직였는지는 시장 지도에서 봅니다.</div>';
}
$('etf-tabs').addEventListener('click', function(e){
  var b = e.target.closest('.tab');
  if (b && b.dataset.v !== ETF_VIEW){ ETF_VIEW = b.dataset.v; renderEtf(); }
});

// =============================================================================
// 지수보다 강한 종목
//
// 등락률이 아니라 **20일선 이격도**로 잰다. 어제 20% 오른 종목이 오늘 1%
// 오른 것과, 석 달 눌려 있던 종목이 오늘 1% 오른 것은 다른 일이다.
// 테마에 엮이면 이격이 며칠 만에 벌어졌다 그만큼 빠지기도 해서, 테마에 걸린
// 종목은 어느 테마인지 함께 적는다. 빼지 않는다 — 판단은 보는 사람 몫이다.
// =============================================================================
var STRONG = null, SV = null;

function money(v){
  if (v === null || v === undefined) return '–';
  var a = Math.abs(v);
  if (a >= 1e12) return (v / 1e12).toFixed(1) + '조';
  if (a >= 1e8) return Math.round(v / 1e8).toLocaleString('ko-KR') + '억';
  if (a >= 1e4) return Math.round(v / 1e4).toLocaleString('ko-KR') + '만';
  return Math.round(v).toLocaleString('ko-KR');
}
function strongViews(){ return ['코스피', '코스닥', '급상승', '급하락']; }
function strongRows(v){
  if (!STRONG) return [];
  if (v === '급상승' || v === '급하락') return STRONG[v] || [];
  return ((STRONG.markets || {})[v] || {}).strong || [];
}
function findRow(code){
  var vs = strongViews();
  for (var i = 0; i < vs.length; i++){
    var rs = strongRows(vs[i]);
    for (var j = 0; j < rs.length; j++) if (rs[j].code === code) return rs[j];
  }
  return null;
}

function renderStrong(){
  if (!STRONG) return;
  if (!SV) SV = strongViews()[0];
  $('strong-tabs').innerHTML = strongViews().map(function(v){
    return '<button class="tab' + (v === SV ? ' on' : '') + '" data-v="' +
      esc(v) + '">' + esc(v) + '</button>'; }).join('');

  var rows = strongRows(SV), mk = (STRONG.markets || {})[SV];

  if (!rows.length){
    $('strong-list').innerHTML =
      '<div class="miss">이 갈래에 걸린 종목이 없습니다.</div>';
  } else {
    $('strong-list').innerHTML = rows.map(function(r, i){
      var tags = (r.themes || []).map(function(t){
        return '<i class="tag">' + esc(t.sub) + '</i>'; }).join('');
      return '<button class="r" data-c="' + esc(r.code) + '">' +
        '<span class="no num">' + (i + 1) + '</span><span class="mid">' +
        '<span class="nm">' + esc(r.name) + '</span>' +
        '<span class="sub">' + tags + esc(r.sector || '') + '</span></span>' +
        '<span class="rt"><span class="gap num ' + cls(r.disparity) + '">' +

    }).join('');
  }
  // 기준은 제목 옆이 아니라 목록 아래에 한 번만 적는다.
  // '실시간'이라는 이름과 달리 이 값은 **종가**다. 그 사실을 숨기지 않는다.
  var f = STRONG.floor || {}, why = [];
  if (mk){
    why.push(mk.index_disparity === null

      : SV + ' 지수는 20일선보다 <b>' + signed(mk.index_disparity, 2) +
        '%</b>. 그보다 위에 있는 ' + mk.strong_total + '종목을 이격도 순으로, ' +
        '같으면 거래대금 순으로 세웠습니다.');
  } else {
    why.push('종가 기준 등락률 ' + (SV === '급상승' ? '상위 ' : '하위 ') +
             rows.length + '종목입니다.');
  }
  if (f['거래대금']){
    why.push('거래대금 ' + money(f['거래대금']) + '원 · 시가총액 ' +
      money(f['시가총액']) + '원 이상만 담습니다 — 못 사고 못 파는 종목을 ' +
      '올려두면 그 줄은 읽을 이유가 없습니다' +
      (mk ? ' (' + mk.liquid + '/' + mk.counted + '종목 통과)' : '') + '.');
  }
  why.push('값은 <b>그날 종가</b>입니다. 장중에는 바뀌지 않습니다.');
  why.push('테마에 엮인 종목은 이격이 며칠 만에 벌어졌다 그만큼 빠지기도 해서 ' +
           '어느 테마인지 함께 적습니다.');
  $('strong-why').innerHTML = why.join('<br>');
}

// =============================================================================
// 종목 상세
//
// 받아온 것만 적는다. 못 받은 칸은 '–' 로 둔다 — 0 으로 채우면 배당이 없는
// 회사와 값을 못 받은 회사가 같아 보인다.
// =============================================================================
var schart = null, sro = null, PX = null, SNEWS = null;
var SCODE = null, SFREQ = '일';

function kv(k, v){
  return '<div><span>' + k + '</span><b class="num" style="font-weight:400">' +
    v + '</b></div>';
}

function flowRow(k, v, max){
  var w = max ? Math.min(100, Math.abs(v) / max * 100) : 0;
  var c = v >= 0 ? 'var(--up)' : 'var(--down)';
  return '<div class="flow"><span>' + k + '</span>' +
    '<b class="num ' + cls(v) + '">' + (v > 0 ? '+' : '') + money(v) + '</b>' +
    '<span class="bar"><i style="left:0;width:' + w.toFixed(1) +
    '%;background:' + c + '"></i></span></div>';
}

/* 주봉·월봉은 따로 받지 않는다. 일봉을 묶으면 된다 —
   시가는 첫날, 고가는 최대, 저가는 최소, 종가는 마지막 날. */
function weekKey(ymd){
  var d = new Date(+ymd.slice(0,4), +ymd.slice(4,6) - 1, +ymd.slice(6,8));
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return ymdOf(d);
}
function group(bars, mode){
  if (mode === '일') return bars;
  var out = [], key = null, cur = null;
  for (var i = 0; i < bars.length; i++){
    var b = bars[i];
    var k = mode === '주' ? weekKey(b[0]) : b[0].slice(0, 6);
    if (k !== key){
      if (cur) out.push(cur);
      key = k; cur = [b[0], b[1], b[2], b[3], b[4]];
    } else {
      if (b[2] > cur[2]) cur[2] = b[2];
      if (b[3] < cur[3]) cur[3] = b[3];
      cur[4] = b[4];
    }
  }
  if (cur) out.push(cur);
  return out;
}

function drawSheetChart(){
  var el = $('sheet-chart');
  if (!el) return;
  if (schart){ schart.remove(); schart = null; }
  el.innerHTML = '';
  var raw = ((PX && PX.px) || {})[SCODE] || [];
  if (!raw.length){
    el.innerHTML = '<div class="miss">' + (PX
      ? '이 종목의 일봉을 받지 못했습니다.'
      : '일봉을 불러오는 중입니다…') + '</div>';
    $('sheet-legend').innerHTML = '';
    return;
  }
  var bars = group(raw, SFREQ).map(function(b){
    return {time: toTime(b[0]), open: b[1], high: b[2], low: b[3], close: b[4]};
  });
  if (!window.LightweightCharts || bars.length < 2) return;

  var muted = cssVar('--ink-muted'), rule = cssVar('--rule');
  schart = LightweightCharts.createChart(el, {
    width: el.clientWidth, height: el.clientHeight,
    layout: {background:{color:'transparent'}, textColor: muted,
             fontFamily:"'IBM Plex Mono', monospace", fontSize:10},
    grid: {vertLines:{visible:false}, horzLines:{color: rule}},
    rightPriceScale:{borderColor: rule}, timeScale:{borderColor: rule},
    crosshair:{mode:1}, handleScroll:true, handleScale:true,
  });
  schart.addCandlestickSeries({
    upColor: cssVar('--up'), downColor: cssVar('--down'),
    borderUpColor: cssVar('--up'), borderDownColor: cssVar('--down'),
    wickUpColor: cssVar('--up'), wickDownColor: cssVar('--down'),
  }).setData(bars);

  // 지수 차트와 같은 세 선. 자료가 1년치라 주봉·월봉에서는 긴 선이 안 그려진다.
  // 안 그려진 선을 범례에 남겨두면 없는 것을 있다고 적는 셈이라 뺀다.
  var drawn = [];
  MAS.forEach(function(pair){
    var data = sma(bars, pair[0]);
    if (data.length < 2) return;
    schart.addLineSeries({color: cssVar(pair[1]), lineWidth:2,
      priceLineVisible:false, lastValueVisible:false,
      crosshairMarkerVisible:false}).setData(data);
    drawn.push(pair);
  });
  $('sheet-legend').innerHTML = drawn.map(function(pair){
    return '<span><i style="background:var(' + pair[1] + ')"></i>' + pair[0] +
      SFREQ + '선</span>'; }).join('') +
    (drawn.length < MAS.length
      ? '<span>자료가 1년치라 긴 선은 안 그려집니다</span>' : '');

  schart.timeScale().setVisibleLogicalRange(
    {from: Math.max(0, bars.length - 120), to: bars.length + 2});
  if (sro) sro.disconnect();
  sro = new ResizeObserver(function(){
    if (schart) schart.applyOptions({width: el.clientWidth, height: el.clientHeight});
  });
  sro.observe(el);
}

function sheetNews(){
  var arts = ((SNEWS && SNEWS.news) || {})[SCODE] || [];
  if (!SNEWS) return '<div class="why">뉴스를 불러오는 중입니다…</div>';
  if (!arts.length) return '<div class="why">이 종목의 기사를 받지 못했습니다.</div>';
  return '<div class="snews">' + arts.map(function(a){
    // 그림은 네이버 주소를 그대로 쓴다. 오프라인이거나 주소가 죽으면
    // 그 칸만 비도록 onerror 로 지운다 — 깨진 그림 아이콘이 남으면 안 된다.
    return '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' +
      '<span class="t">' + esc(a.title) + '</span>' +
      '<span class="m">' + esc([a.office, a.at].filter(Boolean).join(' · ')) +
      '</span>' + (a.image
        ? '<img src="' + esc(a.image) + '" alt="" loading="lazy" ' +
          'referrerpolicy="no-referrer" onerror="this.remove()">' : '') +
      '</a>';
  }).join('') + '</div>';
}

       signed(r.disparity, 2) + '%</span>') +
    kv(esc(r.market) + ' 지수 대비', edge === null ? '–' :
       '<span class="' + cls(edge) + '">' + signed(edge, 2) + '%p</span>') +
    '</div>' +

    (mx ? '<h3>투자자 동향 <span style="font-size:11px">순매수 · 그날 하루</span></h3>' +
      flowRow('개인', f.buy_person || 0, mx) +

    kv('PER', f.per === undefined ? '–' : f.per.toFixed(2) + '배') +
    kv('외국인 지분', f.foreign === undefined ? '–' : f.foreign.toFixed(2) + '%') +
    kv('업종', esc(r.sector || '–')) + '</div>' +

      r.themes.map(function(t){

    '<div class="why">PBR·PER·배당수익률·외국인 지분은 KRX 가 그날 낸 값입니다. ' +
    'ROE 와 분기별 실적은 <a href="stocks.html" style="color:var(--accent)">' +

function closeSheet(){
  $('sheet').classList.remove('on');
  document.body.style.overflow = '';

// =============================================================================
// 일정 — 머리의 '오늘 이벤트' 와 주별·월별 보기
// =============================================================================
var OV = '월별';

function evOf(){
  /* 오늘 것. 없으면 가장 가까운 다음 일정. 빈 칸으로 두지 않는다. */
  var rows = calRows(CAL);
  for (var i = 0; i < rows.length; i++) if (rows[i].n === 0) return rows[i];
  for (var j = 0; j < rows.length; j++) if (rows[j].n > 0) return rows[j];
  return null;
}

function renderEv(){
  var e = evOf(), b = $('ev');
  if (!e){
    b.querySelector('.v').textContent = '예정된 일정이 없습니다';
    b.querySelector('.d').textContent = '';
    return;
  }
  b.querySelector('.k').textContent = e.n === 0 ? '오늘 이벤트' : '다음 이벤트';
  b.querySelector('.v').textContent = e.k;
  b.querySelector('.d').textContent = ymd(e.d).slice(5) + ' · ' + dday(e.n);
}

function weekOf(d){
  /* 월요일이 한 주의 시작. */
  var x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function ymdOf(d){
  return d.getFullYear() +
    ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
}
function today(){
  var a = (CAL && CAL.as_of) || '';
  return a ? new Date(+a.slice(0,4), +a.slice(4,6) - 1, +a.slice(6,8)) : new Date();
}

function renderOvl(){
  $('ovl-tabs').innerHTML = ['주별', '월별'].map(function(v){
    return '<button class="tab' + (v === OV ? ' on' : '') + '" data-v="' +
      esc(v) + '">' + esc(v) + '</button>'; }).join('');
  var rows = calRows(CAL), by = {};
  rows.forEach(function(r){ (by[r.d] = by[r.d] || []).push(r); });
  var now = today(), html;

  if (OV === '주별'){
    var st = weekOf(now), out = [], n = 0;
    for (var i = 0; i < 7; i++){
      var d = new Date(st); d.setDate(st.getDate() + i);
      var key = ymdOf(d), list = by[key] || [];
      n += list.length;
      var mine = key === ymdOf(now);
      out.push('<div class="now"' + (mine ? '' :
          ' style="color:var(--ink-muted)"') + '>' +
        ymd(key).slice(5) + ' ' + '일월화수목금토'[d.getDay()] +
        (mine ? ' · 오늘' : '') + '</div>' +
        (list.length ? list.map(calRow).join('')
                     : '<div class="row"><span class="dd"></span>' +
                       '<span class="meta">–</span></div>'));
    }
    html = '<div class="rule-line">' + ymd(ymdOf(st)).slice(5) + ' 주</div>' +
      '<div class="cal">' + out.join('') + '</div>' +
      (n ? '' : '<div class="why">이번 주에 잡힌 일정이 없습니다. ' +
        '월별로 보면 다음 일정이 보입니다.</div>');
  } else {
    // 월별은 평일 5칸. 주말에는 장이 안 선다.
    var first = new Date(now.getFullYear(), now.getMonth(), 1);
    var last = new Date(now.getFullYear(), now.getMonth() + 1, 0);
    var cur = weekOf(first), tr = [];
    while (cur <= last){
      var tds = '';
      for (var k = 0; k < 5; k++){
        var dd = new Date(cur); dd.setDate(cur.getDate() + k);
        var kk = ymdOf(dd), off = dd.getMonth() !== now.getMonth();
        tds += '<td><div class="dn' + (off ? ' off' : '') +
          (kk === ymdOf(now) ? ' now' : '') + '">' + dd.getDate() + '</div>' +
          (by[kk] || []).map(function(r){
            return '<em title="' + esc(r.k) + '">' + esc(r.k) + '</em>'; }).join('') +
          '</td>';
      }
      tr.push('<tr>' + tds + '</tr>');
      cur = new Date(cur); cur.setDate(cur.getDate() + 7);
    }
    html = '<div class="rule-line">' + (now.getMonth() + 1) + '월 · 평일만</div>' +
      '<table class="mon">' + tr.join('') + '</table>';
  }
  $('ovl-body').innerHTML = html + '<div class="why">' +
    ((CAL && CAL.note) || '') + '</div>';
}

  renderOvl();

// =============================================================================
// 불러오기 — 칸마다 따로 실패한다. 하나가 없다고 화면 전체가 죽지 않는다.
// =============================================================================
function grab(file){
  return fetch(file, {cache:'no-store'}).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
/*
 * 아직 못 받은 칸은 **접는다.** 대신 무엇이 비었는지 맨 아래에 적는다.
 *
 * 예전에는 칸마다 '불러오지 못했습니다'를 크게 띄웠는데, 아직 한 번도 수집이
 * 돌지 않은 지표까지 화면 한 뭉치를 차지하고 앉아 있었다. 조용히 감추는 것도
 * 안 될 일이라 목차에서 빼고 아래에 이름을 남긴다.
 */
var MISSING = [];

function hide(sectionId, label){
  var s = $(sectionId);
  if (s) s.style.display = 'none';
  var t = document.querySelector('.toc a[href="#' + sectionId + '"]');
  if (t) t.style.display = 'none';
  if (MISSING.indexOf(label) < 0) MISSING.push(label);
  var box = $('missing');
  if (!box){
    box = document.createElement('div');
    box.id = 'missing';
    box.className = 'rule-line';
    $('foot').parentNode.insertBefore(box, $('foot'));
  }
  box.textContent = MISSING.join(' · ') + ' — 아직 받지 못했습니다. ' +
    '수집이 한 번 돌면 채워집니다.';
}

/* 목차에 지금 보고 있는 면을 표시한다. */
function spy(){
  var links = [].slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  if (!window.IntersectionObserver || !links.length) return;
  var io = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      links.forEach(function(a){
        a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id);
      });
    });
  }, {rootMargin: '-45px 0px -70% 0px'});
  links.forEach(function(a){
    var s = $(a.getAttribute('href').slice(1));
    if (s) io.observe(s);
  });
}
spy();

// 저장소의 원본은 store/ 에 있지만 Pages 는 docs/ 만 서빙하므로 사본을 읽는다.

    esc(e.message) + '<br><br>수집 워크플로가 아직 한 번도 돌지 않았을 수 있습니다.' +
    '</div>';
});

  hide('cal', '일정');
});

grab('market_strong.json').then(function(p){
  STRONG = p; renderStrong();
}).catch(function(){
  hide('strong', '지수보다 강한 종목');
});

// 해외 지수는 없어도 코스피·코스닥은 그대로 나온다. 머리에서 그 셋만 빠진다.
grab('market_world.json').then(function(p){
  WORLD = p; renderStrip();
}).catch(function(){});

grab('market_tree.json').then(function(p){
  TREE = p;
  TREE_VIEW = treeViews()[0];
  renderTreeTabs(); renderTree();
  // 웹폰트가 늦게 오면 글자 폭이 바뀐다. 대체 폰트로 잰 결과로 개수를 정해두면
  // 폰트가 바뀐 뒤 이름이 잘린 채 남는다 — 실제로 코스피 탭에서 하나 남았다.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderTree);
  if (window.ResizeObserver) new ResizeObserver(renderTree).observe($('map'));
}).catch(function(){
  hide('tree', '시장 지도');
});

grab('market_macro.json').then(function(p){
  MACRO = p; renderMacro();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderMacro);
}).catch(function(){
  hide('macro', '지표 기록');
});

grab('market_etf.json').then(function(p){
  ETF = p; ETF_VIEW = etfViews()[0]; renderEtf();
}).catch(function(){
  hide('etf', 'ETF');
});

grab('market_news.json').then(function(p){ NEWS = p; renderNews(); })
  .catch(function(){
    hide('news', '주요 뉴스');
  });

if ('serviceWorker' in navigator){
  addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}
</script>
</body>
</html>
