  // 막대 위에 얹는 짧은 숫자. 억 단위가 커지면 '조'로 접는다.

  if (a >= 10000) return (v / 10000).toFixed(a >= 100000 ? 0 : 1) + '조';

function bars(labels, vals, title){

  if (hi < 0) hi = 0; if (lo > 0) lo = 0;
  var span = (hi - lo) || 1, plot = H - padT - padB;
  var zero = padT + (hi / span) * plot;
