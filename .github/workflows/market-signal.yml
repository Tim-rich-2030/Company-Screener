name: 시장 신호 수집

# 장 마감(KST 15:30) 이후 종가가 확정된 뒤에 받는다.
# cron은 UTC 기준 — 한국시간(KST) = UTC + 9시간.
on:
  schedule:
    - cron: '30 8 * * 1-5'   # KST 평일 17:30
  workflow_dispatch:

concurrency:
  group: market-signal
  cancel-in-progress: false

permissions:
  contents: write             # 수집 결과를 저장소에 커밋
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -q -r requirements.txt

      - name: 지수 수집 및 계산
        env:
          # 없어도 돌아간다 — 그때는 네이버 차트로 받는다.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python market_signal.py --collect

      # 나스닥·S&P500·다우. FRED 라 키가 필요 없고 종가만 온다 (하루 늦다).
      - name: 해외 지수 수집 (나스닥·S&P500·다우)
        continue-on-error: true
        run: python market_world.py

      # 아래 둘은 실패해도 워크플로를 세우지 않는다. 지수는 이미 받아 뒀고,
      # 시장 지도나 뉴스 하나 때문에 그것까지 못 배포하면 손해가 더 크다.
      # 실패하면 화면의 그 칸만 빈다.
      - name: 시장 지도 수집 (전 종목 등락·업종·제외목록)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python market_tree.py

      # 실적 마감은 계산이라 늘 나온다. FOMC·금통위·미국 지표는 받아와야 한다.
      # FRED_API_KEY 는 없어도 돌아간다 — 그때는 미국 지표 칸만 빈다.
      - name: 캘린더 수집 (실적 마감 · FOMC · 금통위 · 미국 지표)
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python market_calendar.py

      # ECOS_KEY 는 없어도 돌아간다 — 그때는 한국 기준금리만 빈다.
      - name: 거시 지표 수집 (금리·환율·유가 + 이후 기록)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python market_macro.py

      # 1면 현황판. 간밤의 미국 지수·야간선물과, 원/달러·원/엔·WTI·금·비트코인
      # 추세를 받는다. 해외 지수와 야간선물은 받을 곳이 확실하지 않아 후보를
      # 차례로 두드리며, 무엇을 두드려 무슨 답이 왔는지는
      # store/market_board.json 의 why 에 남는다 — 그걸 보고 다음 판을 고친다.
      - name: 증시 현황판 (간밤의 증시 · 주요 지표 추세)
        continue-on-error: true
        run: python market_board.py

      # 코스피200 야간선물 심볼을 아직 못 찾았다. 주소는 살아 있고(409 는
      # '그런 심볼이 없다'는 뜻이다) 이름만 모른다. 아는 심볼로 답이 오는
      # 모양을 확인하고 네이버 화면이 쓰는 코드를 긁어 store/board_probe.json
      # 에 남긴다. 찾으면 이 단계는 뺀다 — 계속 둘 이유가 없다.
      - name: 야간선물 심볼 찾기 (저장만, 화면과 무관)
        continue-on-error: true
        run: python market_board.py --probe

      # 헤드라인(market_headline.json)은 **여기서 만들지 않는다.**
      #
      #   1면이 비어 있지 않게 하려고 여기서도 한 번 돌려 뒀더니, 5분마다 도는
      #   headline.yml 이 같은 파일을 같은 시각에 새로 만들어 놓는 바람에
      #   git pull --rebase 가 add/add 충돌로 멈췄다. 커밋도 배포도 못 하고
      #   그날 받은 지수·종목·현황판이 전부 날아갔다 — 헤드라인 한 칸 때문에.
      #   한 파일의 주인은 하나여야 한다. 헤드라인은 headline.yml 것이다.

      # --themes 는 테마 정의(themes.json)의 이름 조각이 실제 ETF 이름에
      # 걸리는지 보여준다. 비어 있는 소분류가 곧 고쳐야 할 곳이다.
      - name: ETF 수집 + 테마 매칭 점검
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python market_etf.py
          python market_etf.py --themes

      # 테마는 네이버 금융에서 받는다. 인포스탁은 403 이고 유료 자료다
      # (store/theme_probe.json 에 확인 기록이 있다).
      # 우리 18개 분류에 안 걸린 테마 이름은 store/market_theme.json 의
      # unmatched 에 그대로 남는다 — 그걸 보고 themes.json 의 조각을 고친다.
      - name: 테마 수집 (네이버 금융) + 분류 매칭
        continue-on-error: true
        run: python market_theme.py

      # 지수 이격도(market_signal)와 테마(market_theme)를 읽으므로 그 뒤에 둔다.
      # 20일선을 만들려고 전종목 일별 시세를 20번 받는다 — 종목마다 받으면
      # 2,500종목 × 20일이 된다.
      - name: 지수보다 강한 종목 (20일선 이격)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python market_strong.py

      # 목록에 나온 종목에만 뉴스를 붙인다 (2,500종목에 붙일 이유가 없다).
      # market_strong.py 가 만든 목록을 읽으므로 반드시 그 뒤에 둔다.
      - name: 종목 뉴스 (목록에 나온 종목만)
        continue-on-error: true
        run: python market_stocknews.py

      # 갈래 하나라도 비면 0 이 아닌 값을 돌려준다. 그때 곧바로 --dump 를 돌려
      # 실제로 뭐가 내려왔는지 로그에 남긴다 — 다음 실행까지 기다릴 이유가 없다.
      - name: 뉴스 수집 (네이버 금융)
        continue-on-error: true
        run: python market_news.py || python market_news.py --dump

      # 진단은 **--dump 만** 돌린다. 절대 수집기를 다시 돌리지 않는다.
      #
      #   'python X.py >/dev/null || python X.py --dump' 로 두었더니, 실패
      #   여부를 보려고 돌린 앞쪽 수집기가 **앞 단계의 결과를 덮어썼다.**
      #   게다가 이 단계에는 secrets 를 안 넘겨 뒀다. 그래서 ECOS_KEY 를
      #   제대로 등록해 두고도 저장 파일에는 '키가 비어 있음'이 남았다 —
      #   키 없이 다시 돈 결과가 진짜 결과를 지운 것이다.
      #
      #   지금은 못 받은 이유가 store/*.json 에 남으므로 여기서 수집기를
      #   다시 돌릴 이유가 없다. 저장하지 않는 --dump 만 남긴다.
      - name: 진단 (못 받은 목록의 원본 구조)
        continue-on-error: true
        run: python market_flags.py --dump

      # theme_probe.py 는 여기서 뺐다. 어디서 받을 수 있는지 확인하려던 것이고
      # 답은 나왔다 (네이버 금융). 기록은 store/theme_probe.json 에 남아 있고,
      # 파일도 남겨 둔다 — 나중에 다른 출처를 볼 때 다시 쓴다.

      - name: 변경분 커밋
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 하나씩 담는다. git add 는 원자적이라 경로 하나만 없어도 전부
          # 스테이징되지 않는다 — 뉴스 수집이 실패한 날 지수까지 커밋을 놓친다.
          for f in store/market_signal.json docs/market_signal.json \
                   store/market_tree.json  docs/market_tree.json \
                   store/market_calendar.json docs/market_calendar.json \
                   store/market_macro.json docs/market_macro.json \
                   store/market_etf.json   docs/market_etf.json \
                   store/market_news.json  docs/market_news.json \
                   store/market_theme.json docs/market_theme.json \
                   store/market_strong.json docs/market_strong.json \
                   store/market_world.json  docs/market_world.json \
                   store/market_stocknews.json docs/market_stocknews.json \
                   store/market_board.json docs/market_board.json \
                   store/board_probe.json \
                   docs/market_px.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "변경 없음 — 같은 영업일을 다시 받았을 수 있습니다"
          else
            git commit -m "시장 신호 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 5분마다 도는 헤드라인 워크플로가 그 사이에 커밋을 올려 둘 수 있다.
            # 데이터 파일이 부딪히면 **이번 실행이 만든 것**을 남긴다 —
            # 방금 받아 온 값이 최신이다. rebase 중에는 우리 쪽이 'theirs' 다.
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              stuck=$(git diff --name-only --diff-filter=U || true)
              if [ -z "$stuck" ]; then git rebase --abort || true; exit 1; fi
              echo "부딪힌 파일 — 이번 실행 것을 남깁니다: $stuck"
              echo "$stuck" | xargs -r git checkout --theirs --
              echo "$stuck" | xargs -r git add --
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # docs/ 를 커밋만 하고 끝내면 저장소만 최신이고 실제 사이트는 옛 화면이 남는다.
      # GITHUB_TOKEN 으로 만든 푸시는 다른 워크플로의 on:push 를 깨우지 않으므로
      # 여기서 직접 배포해야 한다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

      # 마지막에 둔다 — 여기서 실패해도 위에서 데이터는 이미 저장·배포된 뒤다.
      # 계정을 넣어 뒀는데 만료·비밀번호 변경으로 조용히 네이버로 넘어가면
      # 몇 달이 지나도 모른다. 그래서 실행을 빨갛게 만들어 알린다.
      - name: KRX 로그인 상태 확인 (데이터 수집과 무관)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python market_signal.py --check-krx
