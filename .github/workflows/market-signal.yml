name: 시장 신호 수집

# 장 마감(KST 15:30) 이후 종가가 확정된 뒤에 받는다.
# cron은 UTC 기준 — 한국시간(KST) = UTC + 9시간.
on:
  schedule:
    - cron: '30 8 * * 1-5'   # KST 평일 17:30
  workflow_dispatch:

concurrency:
  group: market-signal
  cancel-in-progress: false

permissions:
  contents: write             # 수집 결과를 저장소에 커밋
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -q -r requirements.txt

      - name: 지수 수집 및 계산
        env:
          # 없어도 돌아간다 — 그때는 네이버 차트로 받는다.
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python market_signal.py --collect

      # 아래 둘은 실패해도 워크플로를 세우지 않는다. 지수는 이미 받아 뒀고,
      # 시장 지도나 뉴스 하나 때문에 그것까지 못 배포하면 손해가 더 크다.
      # 실패하면 화면의 그 칸만 빈다.
      - name: 시장 지도 수집 (전 종목 등락·업종·제외목록)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python market_tree.py

      # 실적 마감은 계산이라 늘 나온다. FOMC·금통위는 받아와야 한다.
      - name: 캘린더 수집 (실적 마감 · FOMC · 금통위)
        continue-on-error: true
        run: python market_calendar.py

      # ECOS_KEY 는 없어도 돌아간다 — 그때는 한국 기준금리만 빈다.
      - name: 거시 지표 수집 (금리·환율·유가 + 이후 기록)
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          ECOS_KEY: ${{ secrets.ECOS_KEY }}
        run: python market_macro.py

      # --themes 는 테마 정의(themes.json)의 이름 조각이 실제 ETF 이름에
      # 걸리는지 보여준다. 비어 있는 소분류가 곧 고쳐야 할 곳이다.
      - name: ETF 수집 + 테마 매칭 점검
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          python market_etf.py
          python market_etf.py --themes

      # 갈래 하나라도 비면 0 이 아닌 값을 돌려준다. 그때 곧바로 --dump 를 돌려
      # 실제로 뭐가 내려왔는지 로그에 남긴다 — 다음 실행까지 기다릴 이유가 없다.
      - name: 뉴스 수집 (네이버 금융)
        continue-on-error: true
        run: python market_news.py || python market_news.py --dump

      # 받아오는 목록들의 원본 구조를 찍는다. 앞 단계에 섞어 두면 로그가 길어
      # 뒤로 밀린 진단이 안 보인다 — 실제로 금통위 표 9행이 로그에 있었는데도
      # 메뉴만 찍혀 원인을 한 번 더 돌려야 알았다. 실패한 것만 찍는다.
      - name: 진단 (못 받은 목록의 원본 구조)
        continue-on-error: true
        run: |
          python market_flags.py    >/dev/null || python market_flags.py --dump
          python market_calendar.py >/dev/null || python market_calendar.py --dump
          python market_macro.py    >/dev/null || python market_macro.py --dump

      # 수집이 아니라 확인이다. 테마 자료를 어디서 받을 수 있는지 응답만 보고
      # store/theme_probe.json 에 적어 둔다. 짐작으로 긁기 전에 무엇이 있는지
      # 먼저 본다 — 이 저장소에서 짐작으로 긁다가 여러 번 헛돌았다.
      - name: 테마 자료 출처 확인 (수집 아님)
        continue-on-error: true
        run: python theme_probe.py

      - name: 변경분 커밋
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 하나씩 담는다. git add 는 원자적이라 경로 하나만 없어도 전부
          # 스테이징되지 않는다 — 뉴스 수집이 실패한 날 지수까지 커밋을 놓친다.
          for f in store/market_signal.json docs/market_signal.json \
                   store/market_tree.json  docs/market_tree.json \
                   store/market_calendar.json docs/market_calendar.json \
                   store/market_macro.json docs/market_macro.json \
                   store/market_etf.json   docs/market_etf.json \
                   store/market_news.json  docs/market_news.json \
                   store/theme_probe.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "변경 없음 — 같은 영업일을 다시 받았을 수 있습니다"
          else
            git commit -m "시장 신호 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # docs/ 를 커밋만 하고 끝내면 저장소만 최신이고 실제 사이트는 옛 화면이 남는다.
      # GITHUB_TOKEN 으로 만든 푸시는 다른 워크플로의 on:push 를 깨우지 않으므로
      # 여기서 직접 배포해야 한다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4

      # 마지막에 둔다 — 여기서 실패해도 위에서 데이터는 이미 저장·배포된 뒤다.
      # 계정을 넣어 뒀는데 만료·비밀번호 변경으로 조용히 네이버로 넘어가면
      # 몇 달이 지나도 모른다. 그래서 실행을 빨갛게 만들어 알린다.
      - name: KRX 로그인 상태 확인 (데이터 수집과 무관)
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python market_signal.py --check-krx
