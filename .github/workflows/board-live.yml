name: 현황판 갱신

# 1면 현황판(간밤의 증시 · 헤드라인)만 15분마다 새로 받는다.
# 지수·종목·테마·지도 같은 무거운 것은 '시장 신호 수집'(하루 한 번)이 맡는다.
#
# =============================================================================
# 왜 예약(cron)으로 안 하는가 — 이 저장소의 예약은 다섯 시간씩 늦는다
# =============================================================================
#
#   워크플로          예약     실제      지연
#   시장 신호        08:30    17:01    +8시간 31분
#   실적 수집        14:00    19:10    +5시간 10분
#   실적 수집        10:00    16:20    +6시간 20분
#   주간 보정  토    01:00    08:58    +7시간 58분
#
#   예약이 26번 돌긴 했다. 다만 제시간에 온 적이 한 번도 없다. 그래서
#   '*/5' 도 '*/15' 도 **0회** 였다 — 다음 차례가 오기 전에 이미 밀려 있으니
#   GitHub 이 통째로 버린다. 주기를 어떻게 조정해도 이건 안 풀린다.
#
#   반면 workflow_dispatch 는 몇 초 안에 뜬다. 그래서 **한 판이 끝날 때
#   다음 판을 스스로 깨운다.** 아래 cron 은 사슬이 끊겼을 때 되살리는
#   그물이라 늦게 와도 상관없다 — 늦는 것이 예정된 쓰임새다.
#
# =============================================================================
# 왜 배포를 안 하는가 — 커밋만으로 화면이 바뀐다
# =============================================================================
#
#   raw.githubusercontent.com 은 CORS 를 열어 준다.
#     access-control-allow-origin: *
#     cache-control: max-age=300
#
#   화면이 거기서 직접 읽으므로 Pages 배포가 필요 없다. 갱신 한 번이
#   1분에서 10초로 줄고, 그래서 셸 반복문 안에서 돌릴 수 있게 된다.
#
#   그 파일들은 main 이 아니라 **live 가지**에 올린다. 15분마다 main 에
#   커밋하면 하루 백 번씩 이력이 쌓이고, 하루 한 번 도는 워크플로와
#   부딪힌다. live 는 커밋 하나짜리로 계속 덮어쓰므로 이력이 자라지 않는다.
on:
  workflow_dispatch:
  schedule:
    # 사슬이 끊겼을 때만 쓰이는 그물. 몇 시간 늦게 와도 제 몫을 한다.
    - cron: '25 * * * *'

# 두 판이 겹치면 같은 가지에 서로 밀어 넣는다. 앞의 판이 끝날 때까지 기다린다.
concurrency:
  group: board-live
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  live:
    runs-on: ubuntu-latest
    # 한 작업의 상한은 6시간이다. 뒷정리와 다음 판 깨우기에 쓸 여유를 남긴다.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -q requests

      - name: 15분마다 수집해서 live 가지에 올린다
        id: loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_MINUTES: 300          # 5시간 돌고 다음 판에 넘긴다
          EVERY_SECONDS: 900        # 15분
        run: |
          set -uo pipefail
          started=$(date +%s)
          deadline=$(( started + RUN_MINUTES * 60 ))
          n=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$(( n + 1 ))
            echo "::group::$n 번째 (KST $(TZ=Asia/Seoul date '+%m-%d %H:%M'))"

            # 실패해도 반복문을 세우지 않는다. 한 판 걸러도 15분 뒤에 다시 온다.
            python market_headline.py || echo "헤드라인 실패 — 이번 판은 넘어갑니다"
            python market_board.py --quick || echo "현황판 실패 — 이번 판은 넘어갑니다"

            # live 가지는 **매번 새로 만든다.** 커밋 하나짜리 저장소를 그때그때
            # 지어서 강제로 덮어쓰므로 이력이 자라지 않는다. 여기 저장소를
            # 건드리지 않으니 다음 판이 checkout 한 것과도 어긋나지 않는다.
            live=$(mktemp -d)
            mkdir -p "$live/docs"
            for f in docs/market_headline.json docs/market_board.json; do
              [ -f "$f" ] && cp "$f" "$live/docs/"
            done
            git -C "$live" init -q
            git -C "$live" config user.name  "github-actions[bot]"
            git -C "$live" config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$live" add -A
            git -C "$live" commit -q -m "현황판 $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git -C "$live" push -q --force \
                 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
                 HEAD:refs/heads/live; then
              echo "live 가지에 올렸습니다"
            else
              echo "::warning::live 가지에 못 올렸습니다 — 다음 판에 다시 시도합니다"
            fi
            rm -rf "$live"
            echo "::endgroup::"

            left=$(( deadline - $(date +%s) ))
            if [ "$left" -le "$EVERY_SECONDS" ]; then break; fi
            sleep "$EVERY_SECONDS"
          done

          ran=$(( ( $(date +%s) - started ) / 60 ))
          echo "$n 판, $ran 분 돌았습니다"
          echo "ran_minutes=$ran" >> "$GITHUB_OUTPUT"

      # 다음 판을 스스로 깨운다.
      #
      #   GITHUB_TOKEN 으로 만든 요청은 다른 워크플로를 깨우지 못한다 —
      #   무한 재귀를 막으려고 GitHub 이 그렇게 정해 뒀다. 그래서 이 저장소의
      #   Actions 권한만 가진 토큰(ACTIONS_PAT)이 따로 필요하다.
      #
      #   **너무 빨리 끝났으면 깨우지 않는다.** 시작하자마자 터지는 판이
      #   자기를 다시 깨우면 초 단위로 도는 고리가 된다. 한 시간은 돌았어야
      #   다음을 부른다 — 그보다 짧게 끝났다면 무언가 잘못된 것이고,
      #   그때는 위의 cron 그물이 몇 시간 뒤에 되살린다.
      - name: 다음 판 깨우기
        if: always()
        env:
          PAT: ${{ secrets.ACTIONS_PAT }}
          RAN: ${{ steps.loop.outputs.ran_minutes }}
        run: |
          set -uo pipefail
          if [ -z "${PAT:-}" ]; then
            echo "::warning::ACTIONS_PAT 가 없어 다음 판을 못 깨웁니다. " \
                 "발급: github.com/settings/personal-access-tokens " \
                 "(이 저장소 · Actions: Read and write) → Secrets 에 ACTIONS_PAT"
            exit 0
          fi
          if [ "${RAN:-0}" -lt 60 ]; then
            echo "::warning::${RAN:-0}분 만에 끝났습니다 — 고리가 될 수 있어 " \
                 "다음 판을 깨우지 않습니다. cron 그물이 되살립니다"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${PAT}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/board-live.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "다음 판 깨우기 → HTTP $code"
          [ "$code" = "204" ] || echo "::warning::깨우지 못했습니다 (HTTP $code)"
