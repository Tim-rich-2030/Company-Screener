name: 현황판 갱신

# 5분마다 새로 받는 것 — 장중에 실제로 움직이는 것들만.
#   · 헤드라인 뉴스
#   · 간밤의 증시 + 코스피·코스닥 실시간 지수
#   · 실시간 종목 + 시장 지도 (국내 장중에만)
# 테마·일봉·투자지표·일정은 '시장 신호 수집'(하루 한 번)이 맡는다.
#
# 주기를 15분에서 5분으로 줄였다. **드는 비용은 없다** — 다리는 어차피 다섯
# 시간 반을 서 있고, 지금까지는 그 시간의 대부분을 sleep 으로 흘려보냈다.
# 늘어나는 건 바깥으로 나가는 요청뿐이고, 한 바퀴에 네이버 뉴스 5건과
# KRX 전종목 두어 건이라 세 배가 되어도 여전히 가볍다.
#
# CDN 이 얼마나 잡는지는 **재 봤다.** 헤더만 보고 짐작하면 틀린다.
#
#   raw.githubusercontent 는 'cache-control: max-age=300' 으로 답한다. 그래서
#   처음엔 캐시가 5분을 더 잡는 줄 알았고, 쿼리를 붙여 비껴가려 했다. 그건
#   안 된다 — 처음 쓰는 주소에도 같은 나이의 답이 온다.
#
#     ?z=9314934    source-age: 37
#     ?z=83088275   source-age: 37
#     (없음)         source-age: 37
#
#   그런데 실제로 재 보니 5분이 아니었다. max-age 는 브라우저더러 쓰라는
#   말이고, GitHub 은 푸시할 때 CDN 을 **비운다.**
#
#     03:41:15  커밋이 live 에 올라감
#     03:42:03  CDN 이 새 내용을 내주기 시작   → 48초 (20초 간격 관측)
#
#   그래서 수집 0~5분 + 전파 1분 안쪽 + 화면이 묻는 간격 1분이 된다.
#   흔할 때 서너 분, 나빠도 6분쯤이다. 캐시를 비껴갈 궁리는 필요 없었다.
#
# =============================================================================
# 왜 예약(cron)에 기대지 않는가 — 이 저장소의 예약은 다섯 시간씩 늦는다
# =============================================================================
#
#   워크플로          예약     실제      지연
#   시장 신호        08:30    17:01    +8시간 31분
#   실적 수집        14:00    19:10    +5시간 10분
#   실적 수집        10:00    16:20    +6시간 20분
#   주간 보정  토    01:00    08:58    +7시간 58분
#
#   예약이 26번 돌긴 했다. 다만 제시간에 온 적이 한 번도 없다. 그래서
#   '*/5' 도 '*/15' 도 **0회** 였다 — 다음 차례가 오기 전에 이미 밀려 있으니
#   GitHub 이 통째로 버린다. 주기를 어떻게 조정해도 이건 안 풀린다.
#
# =============================================================================
# 그래서 한 번 시작하면 하루를 덮는다 — 토큰도, 바깥 서비스도 없이
# =============================================================================
#
#   처음엔 '한 판이 끝날 때 다음 판을 스스로 깨우는' 방식으로 짰다. 그러려면
#   토큰이 따로 있어야 한다 — GITHUB_TOKEN 으로 만든 요청은 다른 워크플로를
#   깨우지 못한다 (무한 재귀를 막으려고 GitHub 이 그렇게 정해 뒀다).
#
#   토큰 없이 되는 길이 있었다. **한 작업의 상한은 6시간이지만, 한 실행에
#   담을 수 있는 작업 수에는 그런 제한이 없다.** 5시간 반짜리 다리 넷을
#   차례로 이으면 한 번 시작으로 스물세 시간을 덮는다.
#
#   그리고 한 바퀴 돌 때마다 최신 main 을 다시 받는다. 안 그러면 '하루를
#   덮는다' 가 '고쳐도 하루 동안 안 바뀐다' 와 같은 말이 된다.
#
#   끊긴 자리는 아래 cron 이 메운다. 늦는 것이 오히려 도움이 된다 —
#   실행 중에 예약이 뜨면 다음 판이 '대기' 로 걸리고(concurrency), 지금 판이
#   끝나는 순간 곧바로 이어받는다. 시간마다 뜨므로 대기 자리는 늘 차 있다.
#
# =============================================================================
# 왜 배포를 안 하는가 — 커밋만으로 화면이 바뀐다
# =============================================================================
#
#   raw.githubusercontent.com 은 CORS 를 열어 준다.
#     access-control-allow-origin: *
#     cache-control: max-age=300
#
#   화면이 거기서 직접 읽으므로 Pages 배포가 필요 없다. 갱신 한 번이
#   1분에서 10초로 줄고, 그래서 셸 반복문 안에서 돌릴 수 있게 된다.
#
#   그 파일들은 main 이 아니라 **live 가지**에 올린다. 15분마다 main 에
#   커밋하면 하루 백 번씩 이력이 쌓이고, 하루 한 번 도는 워크플로와
#   부딪힌다. live 는 매번 커밋 하나짜리로 새로 지어 덮어쓰므로 이력이
#   자라지 않는다.
on:
  workflow_dispatch:
  schedule:
    # 이 예약은 '제때 오기' 위한 것이 아니라 **대기 자리를 채워 두기** 위한
    # 것이다. 지금 판이 끝나는 순간 대기하던 판이 이어받는다.
    - cron: '25 * * * *'

# 두 판이 겹치면 같은 가지에 서로 밀어 넣는다. 앞의 판을 끝까지 두고 기다린다.
concurrency:
  group: board-live
  cancel-in-progress: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  live:
    runs-on: ubuntu-latest
    # 다리 넷을 **차례로** 놓는다 (max-parallel: 1). 한 실행이 5.5시간 × 4 =
    # 스물두 시간을 덮는다. 하나가 터져도 다음 다리는 놓는다 (fail-fast: false).
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        leg: [1, 2, 3, 4]
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # **requirements.txt 를 그대로 쓴다.**
      #
      #   처음엔 'pip install requests' 만 뒀다. 그때는 헤드라인과 현황판만
      #   돌렸고 둘 다 requests 면 충분했기 때문이다. 그 뒤 종목 다시 세기를
      #   넣었는데 그건 pykrx 가 있어야 한다. 없으니 market_tree._stock() 이
      #   None 을 돌려주고 'pykrx 없이는 만들 수 없습니다' 로 끝났다 —
      #   코드도 자료도 다 맞는데 부품 하나가 없어서.
      #
      #   단계를 늘릴 때 그 단계가 무엇을 필요로 하는지 같이 봐야 한다.
      #   목록을 여기서 따로 관리하지 않고 requirements.txt 하나만 본다.
      - name: 의존성 설치
        run: pip install -q -r requirements.txt

      - name: 15분마다 수집해서 live 가지에 올린다
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          RUN_MINUTES: 330          # 5시간 반. 상한(6시간)까지 여유를 둔다
          EVERY_SECONDS: 300        # 5분
        run: |
          set -uo pipefail
          started=$(date +%s)
          deadline=$(( started + RUN_MINUTES * 60 ))
          n=0

          while [ "$(date +%s)" -lt "$deadline" ]; do
            n=$(( n + 1 ))
            cycle_start=$(date +%s)
            echo "::group::${{ matrix.leg }}번 다리 · $n 번째 (KST $(TZ=Asia/Seoul date '+%m-%d %H:%M'))"

            # **매번 최신 main 을 다시 받는다.**
            #
            #   워크플로는 시작할 때의 커밋에 묶인다. 한 판이 스물두 시간을
            #   덮으니, 그 사이 고친 코드도 새로 커밋된 자료도 이 판에는
            #   영영 안 들어온다. 실제로 두 번 당했다.
            #     · 코스피·코스닥을 넣었는데 옛 코드로 도는 판이 자리를 잡고
            #       있어 하루 종일 안 나왔다
            #     · store/strong_base.json 이 판 시작 뒤에 커밋되는 바람에,
            #       종목 다시 세기가 매번 '밑감을 못 읽었습니다' 로 끝났다
            #
            #   오래 도는 것과 최신을 따라가는 것은 따로 놀 이유가 없다.
            #   한 판에 한 번이 아니라 **한 바퀴에 한 번** 받는다.
            git fetch --depth=1 origin main -q && git reset --hard -q FETCH_HEAD \
              || echo "::warning::최신 main 을 못 받았습니다 — 이번 판은 있던 것으로 돕니다"

            # 실패해도 반복문을 세우지 않는다. 한 판 걸러도 15분 뒤에 다시 온다.
            python market_headline.py || echo "헤드라인 실패 — 이번 판은 넘어갑니다"
            python market_board.py --quick || echo "현황판 실패 — 이번 판은 넘어갑니다"

            # 종목은 **국내 장중에만** 다시 센다. KRX 를 두드리는 일이고,
            # 장이 닫힌 뒤에는 같은 종가를 계속 다시 세는 셈이라 뜻이 없다.
            # 평일 09:00~15:40 KST.
            #
            # 반드시 market_board 뒤에 둔다 — 지수 이격도를 현황판이 방금
            # 받은 실시간 코스피·코스닥으로 내기 때문이다. 종목만 지금 값으로
            # 재고 지수를 어제 것으로 두면 '지수보다 강한' 이 통째로 기운다.
            kst=$(TZ=Asia/Seoul date +%H%M)
            dow=$(TZ=Asia/Seoul date +%u)
            if [ "$dow" -le 5 ] && [ "$kst" -ge 0900 ] && [ "$kst" -le 1540 ]; then
              python market_strong.py --quick \
                || echo "실시간 종목 실패 — 이번 판은 넘어갑니다"
              # 지도도 장중에 움직인다. 종목 목록과 같은 화면에서 하나만
              # 살아 있으면 어느 쪽이 지금인지 알 수 없다.
              python market_tree.py \
                || echo "시장 지도 실패 — 이번 판은 넘어갑니다"
            else
              echo "국내 장 시간이 아닙니다 (KST $kst) — 종목·지도는 건너뜁니다"
            fi

            # live 가지는 **매번 새로 만든다.** 커밋 하나짜리 저장소를 그때그때
            # 지어서 강제로 덮어쓰므로 이력이 자라지 않는다. 여기 저장소를
            # 건드리지 않으니 다음 판이 checkout 한 것과도 어긋나지 않는다.
            live=$(mktemp -d)
            mkdir -p "$live/docs"
            for f in docs/market_headline.json docs/market_board.json \
                     docs/market_strong.json docs/market_tree.json; do
              [ -f "$f" ] && cp "$f" "$live/docs/"
            done
            git -C "$live" init -q
            git -C "$live" config user.name  "github-actions[bot]"
            git -C "$live" config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$live" add -A
            git -C "$live" commit -q -m "현황판 $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git -C "$live" push -q --force \
                 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" \
                 HEAD:refs/heads/live; then
              echo "live 가지에 올렸습니다"
            else
              echo "::warning::live 가지에 못 올렸습니다 — 다음 판에 다시 시도합니다"
            fi
            rm -rf "$live"
            echo "::endgroup::"

            # 다음 바퀴는 **이번 바퀴가 시작한 때**로부터 센다.
            #
            #   'sleep 300' 을 일이 끝난 뒤에 두면 한 바퀴가 (일한 시간 + 300초)
            #   가 된다. 일이 90초 걸리면 5분이 아니라 6분 반이다. 15분일 때는
            #   그 차이가 묻혔지만 5분에서는 3할이 어긋난다 — 주기를 줄일수록
            #   일한 시간의 몫이 커지기 때문이다.
            next=$(( cycle_start + EVERY_SECONDS ))
            if [ "$deadline" -le "$next" ]; then break; fi
            nap=$(( next - $(date +%s) ))
            if [ "$nap" -gt 0 ]; then
              sleep "$nap"
            else
              # 못 따라가는 것 자체는 사고가 아니다. 다만 조용히 늦으면
              # '5분마다'라고 적어 놓고 실제로는 8분인 줄을 모르게 된다.
              echo "::warning::한 바퀴가 ${EVERY_SECONDS}초를 넘겼습니다 ($(( $(date +%s) - cycle_start ))초) — 쉬지 않고 다음 바퀴로 갑니다"
            fi
          done

          ran=$(( ( $(date +%s) - started ) / 60 ))
          echo "${{ matrix.leg }}번 다리 — $n 판, $ran 분 돌았습니다"
