name: 헤드라인 뉴스

# 1면 현황판의 '헤드라인 뉴스' 만 갱신한다. 지수·종목과 달리 장중에 계속
# 바뀌는 것이라 하루 한 번으로는 늦다.
#
# **5분은 요청이지 보장이 아니다.** GitHub 의 예약 실행은 최소 간격이 5분이고,
# 그마저도 붐비는 시간에는 뒤로 밀린다. 실제로는 5~15분 사이로 돈다고 보면
# 된다. 화면에 적히는 집계 시각은 '마지막으로 순위가 바뀐 때'다.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# 밀린 실행이 쌓이면 의미가 없다 — 늦은 순위표는 늦은 뉴스일 뿐이다.
# 새 실행이 오면 앞의 것을 버린다.
concurrency:
  group: headline
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  headline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -q requests

      # 순위가 지난번과 같으면 파일을 아예 다시 쓰지 않는다. 그러면 아래
      # 커밋 단계가 '변경 없음' 으로 끝나고 배포도 돌지 않는다 — 5분마다
      # 커밋·배포를 하루 288번 하는 것을 막는 것이 이 설계의 핵심이다.
      - name: 헤드라인 수집
        run: python market_headline.py

      - name: 변경분 커밋
        id: commit
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in store/market_headline.json docs/market_headline.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "순위 그대로 — 커밋하지 않습니다"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "헤드라인 $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 하루 한 번 도는 '시장 신호 수집' 이 그 사이에 커밋을 올려 둘 수
            # 있다. 부딪히면 이번 실행 것을 남긴다 (rebase 중에는 'theirs').
            if ! git pull --rebase --autostash origin "${GITHUB_REF_NAME}"; then
              stuck=$(git diff --name-only --diff-filter=U || true)
              if [ -z "$stuck" ]; then git rebase --abort || true; exit 1; fi
              echo "부딪힌 파일 — 이번 실행 것을 남깁니다: $stuck"
              echo "$stuck" | xargs -r git checkout --theirs --
              echo "$stuck" | xargs -r git add --
              GIT_EDITOR=true git rebase --continue
            fi
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      # 바뀐 게 있을 때만 배포한다.
      #
      # 하루 한 번 도는 '시장 신호 수집' 과 배포가 겹치면 둘 중 하나가 밀린다.
      # 그래도 실행을 빨갛게 만들지는 않는다 — 5분 뒤에 다시 오는 갱신이고,
      # 한 번 건너뛴다고 잃는 것이 없다.
      - if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - if: steps.commit.outputs.changed == 'yes'
        continue-on-error: true
        uses: actions/deploy-pages@v4
